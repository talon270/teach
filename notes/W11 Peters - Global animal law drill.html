er se<\/b> calling for a global response\"<\/mark> <span class=\"fnm\">fn 51<\/span> (Kelch 2011; Park & Singer, \"The Globalization of Animal Welfare\", <i>Foreign Affairs<\/i> 2012) <span class=\"pg\">p. 16<\/span>. It arises \"from <b>six, partly overlapping, grounds<\/b>\".<\/p><\/div>\n<p class=\"tip\"><b>Do not mix up:<\/b> the section 3 question (is welfare already a global norm or a general principle?) is left open. The section 5 argument works <i>without<\/i> answering it.<\/p>\n\n<h3>2. Ground 1: consumers and the market<\/h3>\n<p>\"Increasing attention to welfare aspects by <b>consumers<\/b> in their purchasing decisions\" affects industry and governments <span class=\"fnm\">fn 52<\/span>. <b>Industrialized<\/b> countries' consumers increasingly expect lawmakers to take welfare seriously, \"for varying reasons, including <b>anthropocentric motives such as human health<\/b> and fitness\" <span class=\"fnm\">fn 53<\/span> (Vapnek and Chapman: \"Regardless of the ethical concerns, many countries may choose to enact and enforce animal welfare legislation in the interest of increasing production and trade in animal-based foods\") <span class=\"pg\">p. 16<\/span>.<\/p>\n<ul>\n<li>The pressure reaches <b>imports<\/b> too. Example: the <b>EU's seal products regime<\/b>, which the EU promotes by pointing to \"expressions of serious concerns by members of the public and governments sensitive to animal welfare considerations\" <span class=\"fnm\">fn 54<\/span> (Regulation (EC) No. 1007/2009; Recital 1: \"Seals are sentient beings that can experience pain, distress, fear and other forms of suffering\") <span class=\"pg\">p. 17<\/span>.<\/li>\n<li><b>Exporters<\/b> must pay attention to keep market share in stricter states, and so must their regulators if they support their trading industries. An <b>FAO report<\/b> notes: \"Growing international trade is generating more interest in animal welfare elsewhere in the world, in particular in countries seeking to increase trade with Europe\" <span class=\"fnm\">fn 55<\/span>.<\/li><\/ul>\n<div class=\"view\" data-who=\"Peters's view: market or command-and-control?\"><p>The market (\"the invisible hand\") produces proper standards \"only when consumers are <b>comprehensively informed<\/b> before making their purchasing choices\". That \"is typically not the case in the animal-related industry\". As <b>Thomas Kelch<\/b> points out, the animal-use industry \"consciously and massively seeks to <b>foster human ignorance<\/b> about the treatment and characteristics of animals\" <span class=\"fnm\">fn 56<\/span>. <mark>So \"the first stage of regulation should aim for <b>transparency, consumer information, certification, and labelling<\/b>\"<\/mark> <span class=\"pg\">p. 17<\/span>.<\/p><\/div>\n<details class=\"check\"><summary>Check yourself: why can the market alone not fix welfare standards?<\/summary><p>Consumers are not comprehensively informed, and the industry fosters ignorance about how animals are treated (Kelch). So regulation must start with transparency, information, certification and labelling <span class=\"pg\">p. 17<\/span>.<\/p><\/details>\n\n<h3>3. Ground 2: evasion of the law<\/h3>\n<p>\"Secondly, and closely related, global regulation is necessary to <b>prevent evasion of the law<\/b>.\" The animal-processing industry (food and pharmaceuticals) \"is a global industry and thrives on global trade\". A country that improves standards \"cannot do so unilaterally\" because the sectors \"can escape stricter regulation by <b>relocating<\/b>\" <span class=\"fnm\">fn 57<\/span> (Peters, \"The Competition between Legal Orders\", 2014). Such relocation, or \"<b>leakage<\/b>\", to cheap, low-standard countries \"renders high national animal-protection standards meaningless\" <span class=\"pg\">p. 17<\/span>.<\/p>\n<table><tr><th>Example<\/th><th>Facts Peters gives<\/th><\/tr>\n<tr><td><b>Horse slaughter, US to Mexico<\/b> <span class=\"fnm\">fn 58<\/span><\/td><td>The <b>last horse slaughter facilities in the US closed in 2007<\/b>. Exports of horses for slaughter to <b>Canada and Mexico<\/b> then \"increased dramatically (by <b>660% to Mexico<\/b>)\", with \"unintended negative effects\" on welfare, notably during transport <span class=\"pg\">pp. 17–18<\/span>. Source: US Government Accountability Office report GAO-11-228, June 2011. Mexico's welfare standards are \"much lower\".<\/td><\/tr>\n<tr><td><b>Biomedical research, the Basel Declaration<\/b> <span class=\"fnm\">fn 59<\/span><\/td><td>Adopted in <b>2010<\/b> (first Basel Conference, \"Research at a Crossroads\", 29 Nov. 2010) by researchers, research funders and representatives of pharmaceutical and biomedical industries. Its (implicit) objective was to persuade regulators and the public \"to renounce overly strict regulation of biomedical research involving animals\". Statements stressed preserving <b>Switzerland<\/b> as a research site, and implicitly raised the danger of <b>outsourcing<\/b> and lost tax income. The official wording: a \"call for more trust, transparency and communication on animal research\" <span class=\"pg\">p. 18<\/span>.<\/td><\/tr><\/table>\n<p><mark>If regulators bow to such pressure, and states try to keep industry by \"an attractively permissive legal environment\", the danger is \"a <b>downward spiral of standards, a race to the bottom<\/b>, to the detriment of animal welfare\"<\/mark> <span class=\"fnm\">fn 60<\/span> (Favre: \"Unrestrained economic competition will always impose the most inhumane conditions on the animals within the system, as they tend to be the cheapest management practices\") <span class=\"pg\">p. 18<\/span>.<\/p>\n\n<h3>4. Ground 3: the level playing field<\/h3>\n<p>States with high standards that are aware of the \"global competition among states over mobile industries\" face \"various policy options\"; Peters names two. (Footnote 61 cites a German expert-council report, 2015, proposing higher welfare standards for farmed animals in Germany, with ways to stop the industry migrating abroad <span class=\"fnm\">fn 61<\/span>.)<\/p>\n<ul>\n<li><b>Lower their standards<\/b>: the race to the bottom.<\/li>\n<li><b>Campaign for uniform international standards<\/b>, \"to prevent other states from exploiting their lower standards as an (unfair) competitive advantage\". Uniform standards \"can <b>level the playing field<\/b> for businesses in high-standard states by subjecting all businesses to one and the same (high) standard\" <span class=\"fnm\">fn 62<\/span> <span class=\"pg\">p. 18<\/span>.<\/li><\/ul>\n<p>The textbook example (fn 62): <b>anti-corruption<\/b>. The US adopted strict national laws after the <b>Watergate<\/b> scandal; they disadvantaged US firms in the new markets in Eastern Europe after the 1990s transformation; so the US pressed for and won an international regime, the <b>OECD Convention on Combating Bribery of Foreign Public Officials in International Business Transactions<\/b> (21 Nov. 1997), which constrains all state parties. <span class=\"notin\">Footnote 62 prints \"In the 1980s, in response to the Watergate scandal\". Not in Peters: Watergate was in the 1970s.<\/span><\/p>\n<p>The EU has \"relatively more stringent animal welfare standards than most of its global trading partners\" and <b>proposed that the WTO should directly address such standards<\/b> <span class=\"fnm\">fn 63<\/span> (WTO Committee on Agriculture, \"European Communities Proposal: Animal Welfare and Trade in Agriculture\", WTO Doc. G/AG/NG/W/19, <b>28 June 2000<\/b>) <span class=\"pg\">pp. 18–19<\/span>. Its motive: to prevent its standards being \"undermined\" and EU products being \"edged out of the market by cheaper imports produced under lower standards\" <span class=\"fnm\">fn 64<\/span>. <mark>But \"the proposal to adopt a WTO-wide animal welfare standard thus far has <b>not found favour with WTO members<\/b>\"<\/mark> <span class=\"pg\">p. 19<\/span>.<\/p>\n\n<h3>5. Ground 4: embeddedness<\/h3>\n<p>\"Fourthly, animal welfare is embedded in a complex set of issues, most of which are of a global nature.\" The <b>industrialization of meat, dairy, and fur production<\/b> has \"massive environmental, climatic, social, and ethical consequences on a global scale\": <b>sustainability, extinction of species, poverty, and malnutrition<\/b>. \"This embeddedness itself is an additional reason why animal welfare can only be tackled globally\" <span class=\"pg\">p. 19<\/span>.<\/p>\n\n<h3>6. Ground 5: a benchmark<\/h3>\n<p>\"A fifth – and pragmatic – reason\": international animal welfare standards \"would provide a <b>benchmark<\/b> for local, national, and international legislation\" <span class=\"pg\">p. 19<\/span>. Activists now face \"the daunting and repetitive task of <b>battling for new laws in multiple, isolated national jurisdictions<\/b>\". A benchmark would let them spend scarce resources on <b>implementation<\/b> of an acknowledged standard <span class=\"fnm\">fn 65<\/span> (Favre, p. 239).<\/p>\n\n<h3>7. Ground 6: an interpretative guideline (VCLT Art. 31(3)(c))<\/h3>\n<p>Existing regimes, \"notably <b>trade agreements<\/b>\", could be read in the light of new international animal-welfare rules. The <b>Vienna Convention on the Law of Treaties (VCLT)<\/b> (Vienna, 23 May 1969, in force 27 Jan. 1980) <span class=\"fnm\">fn 66<\/span> says \"there shall be taken into account … any relevant rules of international law applicable in the relations between the parties\" (<b>Article 31(3)(c)<\/b>) <span class=\"fnm\">fn 67<\/span>. <mark>Only <b>international<\/b>, not domestic, rules could be this \"catalyst for a more animal-friendly reading of existing international trade agreements\"<\/mark> <span class=\"pg\">p. 19<\/span>.<\/p>\n<table><tr><th>Case<\/th><th>What the WTO body did with Art. 31(3)(c)<\/th><\/tr>\n<tr><td><b><i>EC – Biotech<\/i><\/b>, Panel Reports WT/DS 291–293/R, <b>29 June 2006<\/b>, paras 7.49–7.95, notably 7.75<\/td><td>Read the requirement \"applicable in the relations between the parties\" \"<b>infamously narrowly<\/b>\" (Peters's phrase). The <b>Cartagena Protocol<\/b>, on which the European Community had relied, was \"not applicable\", because it had not been ratified by a number of WTO members including the <b>complaining parties<\/b> (<b>Argentina, Canada and the US<\/b>)<\/td><\/tr>\n<tr><td><b><i>Airbus<\/i><\/b> (<i>European Communities and certain Member States – Measures affecting Trade in Large Civil Aircraft<\/i>), Appellate Body Report, WT/DS316/AB/R, <b>18 May 2011<\/b>, paras 839–55<\/td><td><b>Moved away<\/b> from the <i>Biotech<\/i> approach<\/td><\/tr><\/table>\n<div class=\"view\" data-who=\"Peters's view (fn 67)\"><p>\"The <b>better and now prevailing view<\/b> is that it is not necessary for all states in the organization/treaty to also be parties to the other treaty to make the latter usable, if they are not involved in the dispute.\"<\/p><\/div>\n<p class=\"warn\"><b>Trap.<\/b> <i>EC – Seal Products<\/i> (2013, round 2) is the case that called welfare \"a globally recognized issue\". <i>EC – Biotech<\/i> (2006) is the case that read Art. 31(3)(c) narrowly. Both are WTO panel reports, with the EC involved.<\/p>\n\n<h3>8. The conclusion of the section<\/h3>\n<p>\"It follows from these six considerations that <mark>legal rules for improving animal welfare can be effective <b>only if they are enacted globally<\/b>: on both the domestic and the international levels, and in the form of <b>state or interstate regulation and non-state standards<\/b><\/mark>\" <span class=\"pg\">pp. 19–20<\/span>. The \"global\" quality is explained in section 6 (round 5).<\/p>\n<table><tr><th>#<\/th><th>Ground<\/th><th>Key words<\/th><th>Example<\/th><\/tr>\n<tr><td>1<\/td><td>Consumers<\/td><td>attention, imports, information, labelling<\/td><td>EU seal products regime<\/td><\/tr>\n<tr><td>2<\/td><td>Evasion<\/td><td>relocation, \"leakage\", race to the bottom<\/td><td>horses to Mexico; Basel Declaration<\/td><\/tr>\n<tr><td>3<\/td><td>Level playing field<\/td><td>uniform international standards<\/td><td>OECD anti-bribery; EU proposal to the WTO<\/td><\/tr>\n<tr><td>4<\/td><td>Embeddedness<\/td><td>sustainability, extinction, poverty, malnutrition<\/td><td>industrialised meat, dairy, fur<\/td><\/tr>\n<tr><td>5<\/td><td>Benchmark<\/td><td>activists, multiple jurisdictions<\/td><td>–<\/td><\/tr>\n<tr><td>6<\/td><td>Interpretative guideline<\/td><td>VCLT Art. 31(3)(c)<\/td><td><i>EC – Biotech<\/i>; <i>Airbus<\/i><\/td><\/tr><\/table>", "title": "Why the problem is global: six grounds", "mins": "30 + 10", "src": "\"5. The Global Nature of the Problem Requires Global Regulation\", pp. 16–20 (fns 50–67)"}, {"id": "r5", "quiz": [{"t": "mcq", "q": "What does Peters mean by \"global law\"?", "opts": ["Treaties concluded by every state in the world", "The rules of one global court", "A regulatory mix of levels (national, international, regional), makers (state and private) and force (hard and soft law)", "Customary law binding all states"], "a": 2, "ex": "<p>p. 20. \"[A] regulatory mix combining a host of different types of norm.\" It is not limited to treaties or custom, and it includes private standards and NGO declarations.<\/p>"}, {"t": "fill", "q": "An alternative label for global law, taken from this journal's inaugural editorial, is ______ law.", "a": "transnational", "ex": "<p>\"An alternative label would be 'transnational law' in the sense developed in the inaugural editorial of this journal\" (p. 20, fn 68, Heyvaert & Etty 2012).<\/p>"}, {"t": "mcq", "q": "Which scholars' account of transnational environmental law does Peters adopt as \"exactly\" the mixture she describes?", "opts": ["Bowman, Davies and Redgwell", "Otter, O'Sullivan and Ross", "Heyvaert and Etty", "Baldwin, Cave and Lodge"], "a": 2, "ex": "<p>\"[W]hat Heyvaert and Etty describe as transnational environmental law is exactly the above-mentioned mixture\" (p. 20, fn 69). Bowman et al. and Otter et al. diagnose the gap (round 3); Baldwin et al. are cited on regulatory competition (fn 62).<\/p>"}, {"t": "mcq", "q": "Why does Peters think animal law can be treated as a field of its own?", "opts": ["The corpus is thin but has reached a critical mass", "A single treaty already codifies it", "The ICJ has declared it a branch of law", "It is already thick and coherent"], "a": 0, "ex": "<p>\"Although the corpus ... is thin, it has reached a critical mass which justifies representing it as a cross-cutting matter or even as a legal field of its own\" (p. 20). Not thick or coherent: round 3.<\/p>"}, {"t": "short", "q": "List the tasks Peters sets for a scholarly discipline of global animal law.", "a": "<p>Provide a conceptual basis and practical development through legal arguments and concepts; stimulate law reform by identifying gaps (identify, map and analyse the dispersed international norms, universal and regional, hard and soft); comment on and criticise litigation (CJEU, ECtHR, ICJ, WTO Dispute Settlement Body) and reform projects; examine the practical necessity, moral justification and political prospects and strategies for strengthening international animal welfare norms (pp. 20–21). The programme is descriptive-analytical-conceptual with an impetus of legal policy.<\/p>", "ex": "<p><b>Marks.<\/b> Concept and arguments (1); map and analyse norms to find gaps for reform (1); comment on litigation, naming at least two forums (1); necessity, justification, prospects (1); descriptive-analytical-conceptual with legal policy (1). Aim for four of five. pp. 20–21.<\/p>"}, {"t": "mcq", "q": "Which forums does Peters list for litigation that global animal law should comment on?", "opts": ["ICC, ITLOS, ICJ and the UN Security Council", "CAS, WIPO, WTO and the IMF", "CJEU, ECtHR, ICJ and the WTO Dispute Settlement Body", "ECtHR, the OIE, the IWC and CITES"], "a": 2, "ex": "<p>p. 20. The OIE, IWC and CITES are standard setters or treaty bodies, not courts.<\/p>"}, {"t": "fill", "q": "The research programme is \"descriptive-analytical-conceptual\" and has an impetus of legal ______.", "a": "policy", "ex": "<p>\"The research programme would thus be descriptive-analytical-conceptual, and have an impetus of legal policy\" (p. 21).<\/p>"}, {"t": "mcq", "q": "Why does Peters doubt that the OIE can develop a coherent animal welfare regime?", "opts": ["It was founded in 2005", "It has no member states", "It is run by the WTO", "Its mandate is preventing transboundary animal disease to protect human health, and welfare is a \"side show\""], "a": 3, "ex": "<p>p. 21, fns 72–74. \"Animal protection or welfare is not its core objective, but only a 'side show'\". The 2001–05 Strategic Plan names welfare as a priority, but she doubts it can deliver.<\/p>"}, {"t": "fill", "q": "The OIE has traditionally had close relationships with the animal trade and ______ industries.", "a": "livestock", "ex": "<p>\"[C]lose relationships with the animal trade and livestock industries\" (p. 21, fn 74).<\/p>"}, {"t": "mcq", "q": "The campaign for a Universal Declaration on Animal Welfare (UDAW) is pursued by:", "opts": ["A coalition of numerous NGOs", "The WTO Committee on Agriculture", "The European Commission", "The OIE Strategic Plan"], "a": 0, "ex": "<p>p. 21, fn 75 (Gibson 2011). It would sit under the UN, possibly ECOSOC. The WTO Committee on Agriculture received the EU's 2000 proposal (round 4).<\/p>"}, {"t": "mcq", "q": "What is the legal form of the Universal Declaration on Human Rights of 1948, which would be the UDAW's model?", "opts": ["A resolution of the UN General Assembly, not a binding treaty", "A binding multilateral treaty", "An advisory opinion of the ICJ", "A decision of the Security Council"], "a": 0, "ex": "<p>\"[N]ot a binding treaty but formally ... simply a resolution of the UN General Assembly\" (p. 21, fn 76: UNGA Resolution 217A, 10 Dec. 1948).<\/p>"}, {"t": "short", "q": "Contrast the two proposals for an international animal-welfare instrument that Peters discusses after the OIE: the UDAW and a new umbrella treaty.", "a": "<p>The <b>UDAW<\/b> is an NGO campaign for a UN declaration, possibly under ECOSOC, modelled on the 1948 UDHR: formally a General Assembly resolution, not binding; it seeks support from states and individual petitions (p. 21). The <b>umbrella treaty<\/b> is a scholarly proposal: a new <b>binding<\/b> treaty on animal welfare with specific protocols (for example on companion animals and exhibited wildlife), a technique typical of international environmental law (pp. 21–22).<\/p>", "ex": "<p><b>Marks.<\/b> UDAW: NGO campaign, UN declaration like the UDHR 1948, not binding (1); umbrella treaty: binding, with protocols such as companion animals and exhibited wildlife (1); treaty-plus-protocols is typical of international environmental law (1). pp. 21–22.<\/p>"}, {"t": "fill", "q": "The umbrella treaty would be supplemented by specific ______ (for example on companion animals and exhibited wildlife).", "a": "protocols", "ex": "<p>\"[A] new binding umbrella treaty on animal welfare, supplemented by specific protocols\" (pp. 21–22, fn 77, Favre).<\/p>"}], "notes": "<div class=\"lesson-map\"><b>What this round covers.<\/b> What \"global law\" and \"transnational law\" mean, why animal law qualifies, what the new discipline should do, and three proposals for international standards: the OIE, a Universal Declaration on Animal Welfare, and an umbrella treaty.\n<ol><li>What \"global law\" means<\/li><li>The alternative label: \"transnational law\"<\/li><li>Animal law as global animal law<\/li><li>The research programme<\/li><li>Proposal 1: the OIE<\/li><li>Proposal 2: a Universal Declaration on Animal Welfare (UDAW)<\/li><li>Proposal 3: a binding umbrella treaty with protocols<\/li><\/ol><\/div>\n\n<h3>1. What \"global law\" means<\/h3>\n<p><mark>\"Generally speaking, <b>global law<\/b> refers to a <b>regulatory mix<\/b> combining a host of different types of norm.\"<\/mark> <span class=\"pg\">p. 20<\/span> The mix has three parts:<\/p>\n<table><tr><th>Dimension<\/th><th>What it includes<\/th><\/tr>\n<tr><td><b>Levels<\/b><\/td><td><b>National, international, and regional or sub-state<\/b> law<\/td><\/tr>\n<tr><td><b>Makers<\/b><\/td><td>Norms made by <b>states and by private actors<\/b>, including \"standards emerging from industry, often in collaboration with governmental agencies\"<\/td><\/tr>\n<tr><td><b>Force<\/b><\/td><td>Both <b>hard and soft law<\/b>: \"from codes and international conventions to declarations sponsored by non-governmental organizations (NGOs), which often act transnationally\"<\/td><\/tr><\/table>\n\n<h3>2. The alternative label: \"transnational law\"<\/h3>\n<p>\"An alternative label would be '<b>transnational law<\/b>' in the sense developed in the <b>inaugural editorial of this journal<\/b>\" <span class=\"fnm\">fn 68<\/span> (Heyvaert & Etty, \"Introducing Transnational Environmental Law\", <i>TEL<\/i> 1(1) (2012), pp. 1–11) <span class=\"pg\">p. 20<\/span>.<\/p>\n<div class=\"view\" data-who=\"Heyvaert and Etty, as Peters reports them\"><p>Transnational environmental law is \"exactly the above-mentioned mixture\": \"the product of a rich combination of <b>local, regional and transboundary communications and pressures<\/b>\", of \"engagement with <b>multilevel governance<\/b>\", including \"<b>private action in the public interest<\/b>\", and \"<b>cross-regime<\/b>\" processes <span class=\"fnm\">fn 69<\/span> (pp. 4–6) <span class=\"pg\">p. 20<\/span>.<\/p><\/div>\n<p>Such normative orders on various issues can already be called \"global\" or \"transnational\": Peters names \"a '<b>global administrative law<\/b>'\" and \"a '<b>transnational environmental law<\/b>'\". The label \"allow[s] us to grasp the characteristics of these branches of the law better, and thus to adequately analyze, criticize, and develop the law\" <span class=\"pg\">p. 20<\/span>.<\/p>\n<p class=\"tip\"><b>Two names, one idea:<\/b> \"global law\" and \"transnational law\" both mean a mix of levels (national to international), makers (state and private) and force (hard and soft). Peters uses \"global\" and \"transnational\" for the same thing, as in the abstract (\"global or transnational\").<\/p>\n\n<h3>3. Animal law as global animal law<\/h3>\n<p>Animal law \"can best be applied and analyzed when legal practitioners and scholars are mindful, simultaneously, of the various 'levels' of the law and the various types of norm\" <span class=\"pg\">p. 20<\/span>. <mark>The corpus of domestic, international and local, state-made and private, hard and soft norms on animals \"is <b>thin<\/b>, it has reached a <b>critical mass<\/b> which justifies representing it as a <b>cross-cutting matter or even as a legal field of its own<\/b>, under the overarching heading of <b>global animal law<\/b>\"<\/mark>.<\/p>\n<details class=\"check\"><summary>Check yourself: why is animal law \"global law\" in Peters's sense?<\/summary><p>Its norms mix <b>levels<\/b> (domestic, European, international), <b>makers<\/b> (state and private, such as industry standards) and <b>force<\/b> (hard and soft law). Though thin, the corpus has \"reached a critical mass\" <span class=\"pg\">p. 20<\/span>.<\/p><\/details>\n\n<h3>4. The research programme<\/h3>\n<p>\"What should and could a scholarly discipline of global animal law deliver?\" <span class=\"pg\">p. 20<\/span> Peters lists its tasks in order:<\/p>\n<ol>\n<li><b>Conceptual basis and practical development<\/b>: furnish \"appropriate legal arguments and concepts\".<\/li>\n<li><b>Law reform<\/b>, by identifying legal gaps. First the dispersed international norms (universal and regional, \"notably European\", hard and soft) must be <b>identified, mapped, and analyzed<\/b>.<\/li>\n<li><b>Comment and critique<\/b> of international and European <b>litigation<\/b> (before the <b>CJEU, ECtHR, ICJ and the WTO Dispute Settlement Body<\/b>) and of legal reform projects.<\/li>\n<li>Examine \"the <b>practical necessity<\/b>, the <b>moral justification<\/b>, and the <b>political prospects and strategies<\/b>\" for consolidating and strengthening international animal welfare norms specifically <span class=\"pg\">pp. 20–21<\/span>.<\/li><\/ol>\n<p><mark>The programme \"would thus be <b>descriptive-analytical-conceptual<\/b>, and have an <b>impetus of legal policy<\/b>\"<\/mark> <span class=\"pg\">p. 21<\/span>. The symposium articles contribute to the new discipline, applying different methods and zooming in on specific sub-questions.<\/p>\n\n<h3>5. Proposal 1: the OIE<\/h3>\n<p>Recent scholarship in international law and <b>international relations<\/b> \"has discovered the issue of animal welfare\" <span class=\"fnm\">fn 70<\/span> (Otter et al.; White). Proposals have surfaced \"to intensify and redirect standard setting by the <b>OIE<\/b>\", which \"boasts of having identified animal welfare as a priority in the <b>OIE Strategic Plan 2001–05<\/b>\". The OIE seeks to \"take the lead internationally on animal welfare and, as the international reference organization for animal health, to elaborate recommendations and guidelines covering animal welfare practices, reaffirming that animal health is a key component of animal welfare\" <span class=\"fnm\">fn 71<\/span> <span class=\"pg\">p. 21<\/span>.<\/p>\n<div class=\"view\" data-who=\"Peters's view\"><p><mark>\"[I]t is <b>doubtful<\/b> whether the OIE is well suited to develop a detailed and coherent animal welfare and protection regime\"<\/mark> <span class=\"fnm\">fn 72<\/span>. The reasons:<\/p>\n<ul>\n<li>Its <b>mandate<\/b> is \"the prevention of the <b>transboundary transmission of animal diseases<\/b> through the exportation of livestock, with the ultimate aim of protecting <b>human health<\/b>\" <span class=\"fnm\">fn 73<\/span>. Footnote 73 cites the Organic Statutes of the OIE, an appendix to the International Agreement for the Creation of an <b>Office International des Epizooties<\/b> (Paris, <b>25 Jan. 1924<\/b>), <b>Art. 4<\/b>: its main objects include promoting and coordinating research on \"contagious diseases of livestock\".<\/li>\n<li>It \"has traditionally entertained <b>close relationships with the animal trade and livestock industries<\/b>\" <span class=\"fnm\">fn 74<\/span>.<\/li>\n<li>\"Animal protection or welfare is not its core objective, but only a '<b>side show<\/b>' by which it seeks to respond to new consumer expectations.\" <span class=\"pg\">p. 21<\/span><\/li><\/ul><\/div>\n\n<h3>6. Proposal 2: a Universal Declaration on Animal Welfare (UDAW)<\/h3>\n<p>\"Another effort, pursued by a <b>coalition of numerous NGOs<\/b>, is the campaign for the adoption of a <b>Universal Declaration on Animal Welfare (UDAW)<\/b> under the auspices of the <b>UN<\/b>, possibly under its <b>Economic and Social Council (ECOSOC)<\/b>\" <span class=\"fnm\">fn 75<\/span> (Gibson, <i>Deakin Law Review<\/i> 2011, with the draft text in the appendix). The campaign \"seeks to attract support by <b>states and by individual petitions<\/b>\" <span class=\"pg\">p. 21<\/span>.<\/p>\n<p><mark>The model is the <b>Universal Declaration on Human Rights of 1948<\/b>: \"not a binding treaty but formally ... simply a <b>resolution of the UN General Assembly<\/b>\"<\/mark> <span class=\"fnm\">fn 76<\/span> (New York, 10 Dec. 1948, UNGA Resolution 217A) <span class=\"pg\">p. 21<\/span>.<\/p>\n\n<h3>7. Proposal 3: a binding umbrella treaty<\/h3>\n<p>\"A different scholarly proposal is to promote the adoption of a <b>new binding umbrella treaty on animal welfare<\/b>, supplemented by <b>specific protocols<\/b> (on, for example, <b>companion animals<\/b> and on the care of <b>exhibited wildlife<\/b>)\" <span class=\"fnm\">fn 77<\/span> (Favre) <span class=\"pg\">pp. 21–22<\/span>. This is \"a regulatory technique typically used in <b>international environmental law<\/b>\" <span class=\"pg\">p. 22<\/span>.<\/p>\n<div class=\"view\" data-who=\"Bowman et al., as Peters quotes them\"><p><span class=\"fnm\">fn 78<\/span> Recent developments \"might 'offer some hope for the <b>rationalization and consolidation<\/b> of the at present rather <b>desultory and disjointed<\/b> state of welfare provision' in international law\" <span class=\"pg\">p. 22<\/span>.<\/p><\/div>\n<table><tr><th>Proposal<\/th><th>Form<\/th><th>Binding?<\/th><th>Peters's comment<\/th><\/tr>\n<tr><td><b>OIE<\/b>, intensified standard setting<\/td><td>Recommendations and guidelines<\/td><td>No (secondary law)<\/td><td>\"doubtful\"; mandate is animal disease and human health; \"side show\"<\/td><\/tr>\n<tr><td><b>UDAW<\/b>, NGO campaign<\/td><td>UN declaration, perhaps via ECOSOC; model: UDHR 1948 (a GA resolution)<\/td><td>No<\/td><td>Describes the campaign; no verdict in this passage<\/td><\/tr>\n<tr><td><b>Umbrella treaty<\/b>, scholarly proposal (Favre)<\/td><td>Treaty plus protocols (companion animals; exhibited wildlife)<\/td><td>Yes<\/td><td>Typical technique of international environmental law<\/td><\/tr><\/table>\n<p class=\"warn\"><b>Trap.<\/b> The UDAW would be a <b>declaration<\/b>, modelled on a General Assembly resolution, so it is not binding. The <b>umbrella treaty<\/b> is the binding option. Peters names the OIE as an existing standard setter, not as a treaty body.<\/p>\n<details class=\"check\"><summary>Check yourself: why does Peters doubt that the OIE can build a coherent animal welfare regime?<\/summary><p>Its mandate is preventing the cross-border spread of animal diseases (protecting human health); it has close ties to the animal trade and livestock industries; and welfare is a \"<b>side show<\/b>\" <span class=\"pg\">p. 21<\/span>.<\/p><\/details>", "title": "Global animal law: scope, research programme, three proposals", "mins": "25 + 10", "src": "\"6. The Scope and Tasks of Global Animal Law\", pp. 20–22 (first part; to the treaty proposal) (fns 68–79)"}, {"id": "r6", "quiz": [{"t": "mcq", "q": "What do \"horizontal\" and \"vertical\" comparisons mean in Peters's research programme?", "opts": ["Horizontal: among species. Vertical: among treaties", "Horizontal: among national legal regimes. Vertical: among national, European and international regimes", "Horizontal: among courts. Vertical: among NGOs", "Horizontal: among hard-law norms. Vertical: among soft-law norms"], "a": 1, "ex": "<p>\"'[H]orizontal' comparisons (among different national legal regimes) and 'vertical' legal comparisons (among national, European, and international legal regimes)\" (p. 22).<\/p>"}, {"t": "mcq", "q": "Which of these is <b>not<\/b> one of the four areas of law to which Peters says animal law must be linked?", "opts": ["International economic law", "International human rights law", "The law of the sea", "The law of development"], "a": 2, "ex": "<p>\"[I]nternational economic law, international environmental law, international human rights law, and the law of development\" (p. 22).<\/p>"}, {"t": "mcq", "q": "What could tagging the theme \"global animal law\" do for international law, according to Peters?", "opts": ["Replace the ICJ Statute", "Turn all welfare norms into jus cogens", "Function as a brace that counters fragmentation of international law", "Remove the need for domestic law"], "a": 2, "ex": "<p>\"[C]ould function as a brace which counters the fragmentation of international law in these areas\" (p. 22).<\/p>"}, {"t": "short", "q": "What warning does Peters give about the global spread of animal-law ideas, and what does she propose instead?", "a": "<p>Research must be sensitive to <b>Eurocentrism, legal imperialism and a North–South divide<\/b>, because attitudes to animals depend on habits, religion, wealth and industrialization. It \"should not naively export European values but should seek an <b>overlapping consensus<\/b>\", strengthened by arguments that can be transmitted transnationally and may become universal (Kelch: Feminist Care Theory) (p. 22).<\/p>", "ex": "<p><b>Marks.<\/b> Eurocentrism / legal imperialism / North–South divide (1); do not naively export European values (1); overlapping consensus, with Kelch's Feminist Care Theory as one route (1). p. 22.<\/p>"}, {"t": "fill", "q": "Peters says research should seek an \"______ consensus\" instead of exporting European values.", "a": "overlapping", "ex": "<p>\"[S]eek an overlapping consensus\" (p. 22).<\/p>"}, {"t": "mcq", "q": "Which kind of natural-science finding does Peters say public discourses should be informed by?", "opts": ["Findings on climate change", "Findings on animal population dynamics", "Findings on the economics of livestock", "Findings on the sentience of animals"], "a": 3, "ex": "<p>\"These discourses should be informed by findings of natural science on the sentience of animals\" (p. 22). Economics is one of the disciplines listed for interdisciplinary research, but not as the natural-science finding.<\/p>"}, {"t": "mcq", "q": "Which of these disciplines does Peters <b>not<\/b> list as sources for interdisciplinary research on global animal law?", "opts": ["Political science", "Cultural studies", "Philosophy (ethics)", "Anthropology (human–animal studies)"], "a": 0, "ex": "<p>\"[P]hilosophy (ethics), biology (zoology), anthropology (human−animal studies), history, cultural studies, economics, as well as other disciplines\" (p. 22). Political philosophy appears in the abstract and \"political theory\" in fn 85, but \"political science\" is not on this list.<\/p>"}, {"t": "short", "q": "State Peters's conclusion and the further step she says can be taken beyond \"pragmatic and conventional research boundaries\".", "a": "<p><b>Conclusion:<\/b> animal welfare awaits global (transnational) regulation, because high domestic standards cannot be implemented unilaterally when industries threaten to relocate to places with lower standards. This calls for <b>global animal law<\/b> as a branch of international law and as a scholarly discipline (p. 22). <b>Further step:<\/b> treat the global improvement of animal welfare as a matter of <b>global justice<\/b> (pp. 22–23), which requires the leap from welfare to rights.<\/p>", "ex": "<p><b>Marks.<\/b> Unilateral implementation impossible because of relocation (1); global animal law as a branch and a discipline (1); global justice as the further step (1). pp. 22–23.<\/p>"}, {"t": "mcq", "q": "In the global-justice argument as Peters states it, what is \"morally irrelevant\" to what a human being is owed?", "opts": ["The person's wealth", "The place of birth or the nationality of a person", "The person's species", "The person's religion"], "a": 1, "ex": "<p>\"[T]he place of birth or the nationality of a person is morally irrelevant to what a human being is owed for reasons of fundamental justice\" (p. 23). Horta then extends it to animals: sentience, not species, is the morally relevant feature.<\/p>"}, {"t": "fill", "q": "Oscar Horta says basic justice is owed to both Swedes and ______.", "a": "Somalis", "acc": ["Somalians", "Somali"], "ex": "<p>Horta, quoted p. 23 (fn 82): \"being born in Sweden or in Somalia should be equally irrelevant for the award of basic rights\" to sentient animals.<\/p>"}, {"t": "mcq", "q": "Which feature does Horta say makes nonhuman animals deserve basic rights?", "opts": ["Sentience", "Membership of a species protected by CITES", "Economic value", "Intelligence"], "a": 0, "ex": "<p>\"[I]f nonhuman animals possess the morally relevant features – that is, sentience – ...\" (p. 23, fn 82). The seal regulation also calls seals \"sentient beings\" (p. 17, fn 54).<\/p>"}, {"t": "mcq", "q": "What \"leap\" does Peters say global-justice reasoning requires?", "opts": ["From regional law to universal law", "From the OIE to the WTO", "From animal welfare to animal rights", "From soft law to hard law"], "a": 2, "ex": "<p>\"Such reasoning requires us to take the leap from animal welfare to animal rights\" (p. 23). The legal conceptualization faces \"doctrinal, political, and moral objections\".<\/p>"}, {"t": "fill", "q": "Peters ends by calling global animal law a manifestation and a driver of the broader \"animal ______\".", "a": "turn", "ex": "<p>\"[T]he broader ongoing 'animal turn' in the social sciences and humanities\" (p. 23, fns 84–85). Ritvo is cited as the seminal source (fn 84).<\/p>"}, {"t": "short", "q": "Define the \"animal turn\" and name two fields in which it has appeared, with one scholar each.", "a": "<p>\"[A]n increasing scholarly interest in animals in new terms and under new premises, focusing on the relationships between humans and other animals, and on the role and status of animals in (human) society\" (fn 84). Fields (fn 85): <b>ethnography<\/b> (Haraway, <i>When Species Meet<\/i>; Kirksey & Helmreich; Ingold) and <b>political theory<\/b> (Donaldson & Kymlicka, <i>Zoopolis<\/i>; Ahlhaus & Niesen). Ritvo (2007) is cited as the seminal text.<\/p>", "ex": "<p><b>Marks.<\/b> Definition: new scholarly interest in animals, human–animal relations, animals' status in society (1); two fields (1); one scholar each (1). p. 23, fns 84–85.<\/p>"}], "notes": "<div class=\"lesson-map\"><b>What this round covers.<\/b> The methods of the new field (comparison, links to other branches, caution about Eurocentrism, interdisciplinarity), the conclusion, and the last step: global justice, Horta, and the leap from animal welfare to animal rights.\n<ol><li>Comparative method: horizontal and vertical<\/li><li>Links to four other branches of law, and a \"brace\" against fragmentation<\/li><li>Attitudes, Eurocentrism and an \"overlapping consensus\"<\/li><li>Interdisciplinarity<\/li><li>The conclusion<\/li><li>Beyond pragmatism: global justice<\/li><li>Horta: Swedes and Somalis<\/li><li>From welfare to rights, and the \"animal turn\"<\/li><li>The course lens for this reading<\/li><\/ol><\/div>\n\n<h3>1. Comparative method<\/h3>\n<p>\"Research into global animal law must include a <b>comparative perspective<\/b> and not be limited to international law <i>stricto sensu<\/i>, because the relevant body of hard international law is very fragmented and thin.\" <span class=\"pg\">p. 22<\/span> It involves two kinds of comparison:<\/p>\n<table><tr><th>Comparison<\/th><th>Between<\/th><\/tr>\n<tr><td><b>\"Horizontal\"<\/b><\/td><td>different <b>national<\/b> legal regimes<\/td><\/tr>\n<tr><td><b>\"Vertical\"<\/b><\/td><td><b>national, European and international<\/b> legal regimes<\/td><\/tr><\/table>\n\n<h3>2. Links to other branches, and a \"brace\"<\/h3>\n<p>Legal research on animals \"needs to take into account and must be linked to\" four areas: <b>international economic law<\/b>, <b>international environmental law<\/b>, <b>international human rights law<\/b>, and the <b>law of development<\/b> <span class=\"pg\">p. 22<\/span>. Identifying \"animal welfare\" as a cross-cutting theme in these sub-areas \"would allow for a better analysis of that theme\". <mark>Tagging it \"global animal law\" \"could function as a <b>brace which counters the fragmentation of international law<\/b> in these areas\"<\/mark>.<\/p>\n<details class=\"check\"><summary>Check yourself: name the four branches that animal law must be linked to.<\/summary><p>International <b>economic<\/b> law, international <b>environmental<\/b> law, international <b>human rights<\/b> law and the <b>law of development<\/b> <span class=\"pg\">p. 22<\/span>.<\/p><\/details>\n\n<h3>3. Attitudes, Eurocentrism and an \"overlapping consensus\"<\/h3>\n<p>\"The legal protection of animals, their status, and their potential rights ultimately depend on <b>human attitudes<\/b> towards animals\", which are influenced by \"<b>habits, religion, the wealth of a society, its state of industrialization<\/b>, and other cultural factors\" <span class=\"pg\">p. 22<\/span>.<\/p>\n<div class=\"view\" data-who=\"Peters's view (her own caution about power)\"><p><mark>Research \"must therefore be particularly sensitive to problems of <b>Eurocentrism, of legal imperialism, and of a North–South divide<\/b>. It should <b>not naively export European values<\/b> but should seek an <b>overlapping consensus<\/b>\"<\/mark>. The consensus can be strengthened with arguments \"which can be transmitted transnationally, and which have the potential to become universal\" <span class=\"pg\">p. 22<\/span>.<\/p><\/div>\n<p><b>Thomas Kelch<\/b> argues in the symposium that <b>Feminist Care Theory<\/b> could be a foundation for universal moral principles about animals <span class=\"fnm\">fn 79<\/span>. \"At this point, scholarship needs to <b>trust in the transformative power of public discourses<\/b>, and also feed them.\" These discourses \"should be informed by findings of natural science on the <b>sentience<\/b> of animals\" <span class=\"pg\">p. 22<\/span>.<\/p>\n<p class=\"warn\"><b>Trap.<\/b> Peters's caution about Eurocentrism sits <i>inside<\/i> a European-based account: the evidence in sections 3–5 is largely European (the EU, the Council of Europe, the ECtHR). She states the risk; she does not claim to have solved it. She does not name TWAIL.<\/p>\n\n<h3>4. Interdisciplinarity<\/h3>\n<p>Research \"generally needs to be <b>interdisciplinary<\/b>\", drawing on <b>philosophy (ethics), biology (zoology), anthropology (human−animal studies), history, cultural studies, economics<\/b>, \"as well as other disciplines\" <span class=\"pg\">p. 22<\/span>.<\/p>\n\n<h3>5. The conclusion<\/h3>\n<div class=\"view\" data-who=\"Peters's view\"><p><mark>\"[A]nimal welfare is an issue which awaits <b>global (transnational) regulation<\/b>, notably because it is <b>impossible to unilaterally implement<\/b> high domestic animal welfare standards in the face of the threat by relevant industries of <b>relocating<\/b> to production sites with lower animal welfare standards. This constellation calls for <b>global animal law as a branch of international law and as a scholarly discipline<\/b>.\"<\/mark> <span class=\"pg\">p. 22<\/span><\/p><\/div>\n\n<h3>6. Beyond pragmatism: global justice<\/h3>\n<p>\"However, it is possible to push beyond pragmatic and conventional research boundaries, and consider the global improvement of animal welfare as a matter of <b>global justice<\/b>\" <span class=\"fnm\">fn 80<\/span> <span class=\"pg\">pp. 22–23<\/span>. Footnote 80 cites <b>Oscar Horta<\/b> (\"Expanding Global Justice: The Case for the International Protection of Animals\", <i>Global Policy<\/i> 2013) and <b>Martha Nussbaum<\/b> (2004): \"Truly global justice requires not simply that we look across the world for other fellow species members who are entitled to a decent life. It also requires looking around the world at the other sentient beings with whose lives our own are inextricably and complexly intertwined\".<\/p>\n<p>The ideas developed for human rights and global justice also \"provide strong support for the claim that the interests of <b>nonhuman animals<\/b> should be respected and protected internationally\" <span class=\"fnm\">fn 81<\/span> (Horta, p. 372) <span class=\"pg\">p. 23<\/span>.<\/p>\n<p><mark>The core idea of global justice (as applied to humans) is that \"the <b>place of birth or the nationality<\/b> of a person is <b>morally irrelevant<\/b> to what a human being is owed for reasons of fundamental justice\"<\/mark>. So \"the protection of basic interests should not be dependent on different national legislative enactments but must be guaranteed <b>globally in a uniform way<\/b>\" <span class=\"pg\">p. 23<\/span>.<\/p>\n\n<h3>7. Horta: Swedes and Somalis<\/h3>\n<div class=\"view\" data-who=\"Oscar Horta (fn 82)\"><p>\"[B]asic justice is owed to all those who possess the morally relevant features – and hence to both <b>Swedes and Somalis<\/b>. But if this is the case for humans, then it must apply to nonhuman animals too. … [I]f nonhuman animals possess the morally relevant features – that is, <b>sentience<\/b> – then being born in Sweden or in Somalia should be equally irrelevant for the award of basic rights to them. Why? Because this fact has nothing to do with what the theories of wellbeing claim is valuable for us, which is what can constitute the basis for the attribution of rights.\" <span class=\"pg\">p. 23<\/span><\/p><\/div>\n<p><span class=\"fnm\">fn 82<\/span> adds Favre's image: \"A horse is a horse regardless of what country it lives in, and it is not appropriate that it can receive high care in some places and no concern in others\".<\/p>\n<p class=\"tip\"><b>Horta in one line:<\/b> if sentience is the morally relevant feature, birth in Sweden or Somalia is as irrelevant for animals' basic rights as it is for people's.<\/p>\n\n<h3>8. From welfare to rights, and the \"animal turn\"<\/h3>\n<div class=\"view\" data-who=\"Peters's view\"><p>\"Such reasoning requires us to take the <b>leap from animal welfare to animal rights<\/b>.\" <mark>The legal conceptualization of rights for animals \"is much more demanding and faces <b>doctrinal, political, and moral objections<\/b>\"<\/mark> <span class=\"fnm\">fn 83<\/span> (her own article, \"Liberté, Égalité, Animalité\"). \"Still, it is likely that this question ... will become <b>ever more pressing<\/b>.\" <span class=\"pg\">p. 23<\/span><\/p><\/div>\n<p>Her last sentence: \"After all, <mark>global animal law is a <b>manifestation and a driver<\/b> of the broader ongoing '<b>animal turn<\/b>' in the social sciences and humanities<\/mark>\" <span class=\"fnm\">fns 84–85<\/span> <span class=\"pg\">p. 23<\/span>.<\/p>\n<ul>\n<li>\"Seminally\" <b>Harriet Ritvo<\/b>, \"On the Animal Turn\" (<i>Daedalus<\/i> 136(4) (2007), pp. 118–22); Sykes <span class=\"fnm\">fn 84<\/span>.<\/li>\n<li>Definition (fn 84, from Peters, Stucki and Boscardin, \"The Animal Turn: What Is It and Why Now?\", <i>Verfassungsblog<\/i>, 14 Apr. 2014): \"an increasing scholarly interest in animals in new terms and under new premises, focusing on the <b>relationships between humans and other animals<\/b>, and on the <b>role and status of animals in (human) society<\/b>\".<\/li>\n<li>Fn 85: <b>ethnography<\/b> (Haraway, <i>When Species Meet<\/i> 2008; Kirksey & Helmreich on multispecies ethnography, 2010; Ingold 2013) and <b>political theory<\/b> (Donaldson & Kymlicka, <i>Zoopolis: A Political Theory of Animal Rights<\/i> 2011; Ahlhaus & Niesen, \"What is Animal Politics?\", 2015). Footnote 85 prints \"Journal of the Finish Anthropological Society\" [Finnish].<\/li><\/ul>\n<details class=\"check\"><summary>Check yourself: what is the \"leap\" at the end, and why is it harder?<\/summary><p>From <b>animal welfare<\/b> to <b>animal rights<\/b>. It is harder because the legal conceptualization of rights for animals \"faces doctrinal, political, and moral objections\" <span class=\"pg\">p. 23<\/span>.<\/p><\/details>\n\n<h3>9. The course lens for this reading<\/h3>\n<div class=\"notin\"><p><b>Not in Peters: answers to the three lens questions, from this reading only.<\/b><\/p>\n<ol><li><b>What is international law, and who makes it?<\/b> Peters treats it as a thin, fragmented mix: treaties (CITES, the Antarctic Protocol), secondary law and recommendations (OIE, IWC, Bern Committee), regional law (EU, Council of Europe), litigation and private standards. Makers: states, international organizations, NGOs and industry. Whether welfare is a general principle under Art. 38 ICJ Statute is \"unsettled\".<\/li>\n<li><b>How does power shape it?<\/b> Capital and industry: relocation, leakage and the race to the bottom (round 4); a trade body, the OIE, close to the livestock industry (round 5). Also the North–South divide and Eurocentrism (p. 22).<\/li>\n<li><b>Which approach?<\/b> None of the listed schools by name. She writes as a doctrinal scholar of \"global\" or \"transnational\" law, with a global-justice turn at the end.<\/li><\/ol><\/div>", "title": "Method, Eurocentrism, the conclusion, and global justice", "mins": "25 + 10", "src": "\"6. The Scope and Tasks of Global Animal Law\" (second part, from \"Research into global animal law must include a comparative perspective\"), pp. 22–23 (fns 79–85)"}], "mocks": [{"id": "mockA", "qs": [{"m": 2, "q": "Distinguish animal welfare from animal rights as Peters presents them, and say what welfarism leaves unchallenged.", "a": "<p>Welfare is a scientific then ethical concept about the living and dying conditions of animals, which aims to mitigate suffering while preserving their economic use; welfarism (Garner) holds that animals should not suffer but have no right to life, with \"unnecessary suffering\" as the key concept (1). It leaves the <b>property status<\/b> of animals unchallenged: using animals is not the problem, what they are used for is. Rights would mean strong moral and legal entitlements (1).<\/p>", "rubric": "1 for welfare/welfarism with its voice, 1 for property status or the contrast with rights."}, {"m": 3, "q": "Give three reasons why Peters says existing international law does not provide a coherent animal-welfare regime.", "a": "<p>Any three of: (1) international instruments cover species, habitats and biodiversity, with welfare incidental (CITES transport clause; Antarctic Protocol) and species (\"good-of-its-kind\") rather than individuals (\"good-of-its-own\"); (2) most welfare rules are secondary law (OIE, Bern Committee, IWC) and typically not legally binding, as Favre's checklist point on live transport shows; (3) the IWC's whale-welfare work is stalled because some parties say it oversteps the mandate; (4) European law is richer but only regional; (5) the provisions are fragmented, qualified, inconsistent, unenforceable and unknown, so there is no \"thick\" body of law (Otter et al.; White; Bowman et al.). One mark each.<\/p>", "rubric": "1 per reason, up to 3. Credit a named example."}, {"m": 3, "q": "Explain \"leakage\" and the \"race to the bottom\", with one example, and say what Peters thinks the high-standard states should do instead.", "a": "<p><b>Leakage<\/b>: industries relocate to cheap, low-standard countries, so high national standards become meaningless (1). Example: horse slaughter moved from the US (last facilities closed 2007) to Mexico, with exports up 660%; or the Basel Declaration 2010, which pressed regulators not to over-regulate research (1). <b>Race to the bottom<\/b>: states compete for mobile industry by relaxing standards. Instead, campaign for <b>uniform international standards<\/b> that level the playing field, as the US did with the OECD anti-bribery convention (1).<\/p>", "rubric": "1 each for leakage, a correct example, and uniform standards or level playing field."}, {"m": 4, "q": "Compare the three proposals Peters discusses for international animal-welfare standards, and give her view of the first.", "a": "<ul><li><b>OIE<\/b>: intensify and redirect its standard setting (eleven sets of standards since 2005; Strategic Plan 2001–05); Peters doubts it: its mandate is preventing the transboundary spread of animal disease and protecting human health, it is close to the livestock industry, welfare is a \"side show\" (2).<\/li><li><b>UDAW<\/b>: an NGO campaign for a UN declaration, modelled on the 1948 UDHR, which is a General Assembly resolution and not binding (1).<\/li><li><b>Umbrella treaty<\/b>: a binding treaty with protocols (companion animals, exhibited wildlife), a technique from international environmental law (1).<\/li><\/ul>", "rubric": "2 for the OIE (1 for the proposal, 1 for her doubt and reasons), 1 for the UDAW, 1 for the treaty."}, {"m": 3, "q": "What does Peters mean by \"global law\" or \"transnational law\", and why does she say animal law can be called \"global animal law\"?", "a": "<p>A <b>regulatory mix<\/b> of levels (national, international, regional or sub-state), makers (states and private actors, including industry standards) and force (hard and soft law, including NGO declarations) (1). \"Transnational law\" is the alternative label from the journal's inaugural editorial (Heyvaert and Etty) (1). Animal norms are thin but have reached a \"critical mass\" that justifies treating them as a cross-cutting matter or a field of its own, and the label helps counter fragmentation (1).<\/p>", "rubric": "1 each for the mix, the alternative label, and critical mass or fragmentation."}, {"m": 3, "q": "Peters invokes Article 38 of the ICJ Statute and Article 31(3)(c) of the VCLT. Explain her use of each.", "a": "<p><b>Art. 38 ICJ Statute<\/b> (general principles of law as a source): some scholars (Sykes; Bowman et al.) say domestic welfare codifications have produced a general principle, a formal source; the WTO Panel in <i>EC – Seal Products<\/i> leaves it open; Peters says it is \"as yet unsettled\" and her case does not depend on it (2: 1 for the argument, 1 for her verdict). <b>Art. 31(3)(c) VCLT<\/b>: relevant rules of international law applicable between the parties are to be taken into account, so new international welfare rules could be an interpretative guideline for trade agreements; <i>EC – Biotech<\/i> read it \"infamously narrowly\", <i>Airbus<\/i> moved away (1).<\/p>", "rubric": "2 for Art. 38 (the claim, her \"unsettled\"), 1 for Art. 31(3)(c)."}, {"m": 2, "q": "What cautions and what further step does Peters add at the end of the foreword?", "a": "<p>Caution: research must be sensitive to Eurocentrism, legal imperialism and the North–South divide, and must seek an overlapping consensus rather than export European values (1). Further step: treat animal welfare as global justice (Horta: birth in Sweden or Somalia is equally irrelevant to animals' basic rights if sentience is what matters), which requires a leap from welfare to animal rights, facing doctrinal, political and moral objections (1).<\/p>", "rubric": "1 for the caution, 1 for global justice with the leap to rights."}], "title": "Mock quiz A", "when": "After round 6", "mins": "25"}], "plan": "<div class=\"prose\">\n<p><b>The reading.<\/b> Anne Peters, \"Global Animal Law: What It Is and Why We Need It\", <i>Transnational Environmental Law<\/i> 5:1 (2016), pp. 9–23, doi:10.1017/S2047102516000066. It is a <b>symposium foreword<\/b>: a framing <b>argument<\/b> article that introduces three articles by Peters, Sykes and Kelch. It has an abstract, six numbered sections (the first is an introduction) and 85 footnotes. It is one of the two Week 11 readings, \"New Frontiers in International Law\". The other, Degener's \"International Disability Law\", has its own drill. This page does not cover it.<\/p>\n<p class=\"tip\"><b>The whole article in one breath.<\/b> Peters says contemporary animal law must be <b>global or transnational<\/b> (transboundary and multilevel) to be effective. <b>Animal welfare<\/b> began as a scientific concept: the living and dying conditions of animals, with the aim to mitigate suffering while preserving human economic use (the \"<b>five freedoms<\/b>\", three dimensions). Welfarism, as a counterpart to animal rights, does not challenge animals' property status. Concern for welfare has become <b>global<\/b>: consumers, ethics and compassion, and 180 OIE states. Whether welfare is already a general principle of law under Art. 38 of the ICJ Statute is \"<b>as yet unsettled<\/b>\". International law still gives welfare \"very little attention\": species, habitat and biodiversity treaties (CITES, CMS, CBD), a few welfare clauses (CITES transport, the 1991 Antarctic Protocol), and mostly <b>non-binding secondary law<\/b> (the Bern Committee, the IWC, the OIE's eleven sets of standards). Europe has more, but only regionally. No \"coherent and 'thick' body of law\" exists. Six <b>grounds<\/b> show that regulation must be global: consumers, <b>evasion and the race to the bottom<\/b> (horses to Mexico, the Basel Declaration), the <b>level playing field<\/b>, embeddedness in global problems, a <b>benchmark<\/b> for activists, and an <b>interpretative guideline<\/b> through VCLT Art. 31(3)(c). <b>Global law<\/b> is a regulatory mix of levels, makers (state and private) and force (hard and soft); animal law has reached a \"critical mass\" to be a field, <b>global animal law<\/b>. Peters weighs three proposals: the OIE (doubtful: a \"side show\"), a Universal Declaration on Animal Welfare, and a binding umbrella treaty with protocols. Research must be comparative, linked to economic, environmental and human rights law, interdisciplinary, and wary of <b>Eurocentrism<\/b>. She ends by pushing from welfare toward <b>global justice<\/b> (Horta: birth in Sweden or Somalia is equally irrelevant to animals' basic rights), the \"leap\" to <b>animal rights<\/b>, and the \"<b>animal turn<\/b>\".<\/p>\n<h3>How the readings connect<\/h3>\n<p>Peters's reading is the first of the course's \"new frontiers\" week: she asks how a new branch of international law can form when treaty law is thin. It touches the course in two places, and the links use no reading that has not been summarised in full. <b>Sources<\/b> (Week 3): whether animal welfare is a \"general principle of law\" under Art. 38 of the ICJ Statute is a question about sources. <b>Power<\/b> (course lens 2): her \"race to the bottom\" is industry and capital moving to where regulation is cheapest, and her warning about Eurocentrism is a point about who writes the norms. <b>Week 11 partner:<\/b> Degener, \"International Disability Law\", has its own drill and is not summarised here.<\/p>\n<h3>How each round works<\/h3>\n<ol>\n<li><b>Learn.<\/b> The notes replace the reading: every section, example and substantive footnote is there, with printed page numbers. Answer each <i>Check yourself<\/i> before opening it.<\/li>\n<li><b>Quiz.<\/b> Close the notes. There are three kinds of question: <i>Choose one<\/i>, <i>Type the answer<\/i> (a name, term or year; case and punctuation don't matter) and <i>Write a short answer<\/i> (self-marked against a model). Read every explanation, even when you were right.<\/li>\n<li><b>Fix.<\/b> Press <i>Retry missed<\/i> until the round is clean. Misses also go to the Missed pile.<\/li>\n<li><b>Mock.<\/b> A 20-mark paper in the shape of the course's surprise quizzes: who argued what, key terms, cases and treaties.<\/li>\n<\/ol>\n<div class=\"legend\"><span><span class=\"pg\">p. 8<\/span> printed page<\/span><span><span class=\"fnm\">fn 36<\/span> footnote<\/span><span><mark>exam-critical<\/mark><\/span><\/div>\n<\/div>\n<h3>Schedule · about 4 h 15 min<\/h3>\n<div class=\"sched\">\n  <div class=\"slot day\">Sitting 1<\/div>\n  <div class=\"slot\"><span class=\"t\">30 min<\/span><span><button class=\"btn ghost\" style=\"padding:4px 10px;font-size:14px\" data-view=\"r1\" type=\"button\">1 · The aim, the symposium, and welfare as a concept<\/button><\/span><span class=\"chip\">pp. 9–11<\/span><\/div>\n  <div class=\"slot\"><span class=\"t\">35 min<\/span><span><button class=\"btn ghost\" style=\"padding:4px 10px;font-size:14px\" data-view=\"r2\" type=\"button\">2 · Welfare as a global concern, and the gap begins<\/button><\/span><span class=\"chip\">pp. 11–14<\/span><\/div>\n  <div class=\"slot brk\"><span class=\"t\">10 min<\/span><span>Break. Stand up, drink water, no phone scrolling.<\/span><span><\/span><\/div>\n  <div class=\"slot\"><span class=\"t\">35 min<\/span><span><button class=\"btn ghost\" style=\"padding:4px 10px;font-size:14px\" data-view=\"r3\" type=\"button\">3 · Secondary law, the OIE, Europe, and a diagnosis<\/button><\/span><span class=\"chip\">pp. 14–16<\/span><\/div>\n  <div class=\"slot day\">Sitting 2<\/div>\n  <div class=\"slot\"><span class=\"t\">40 min<\/span><span><button class=\"btn ghost\" style=\"padding:4px 10px;font-size:14px\" data-view=\"r4\" type=\"button\">4 · Why the problem is global: six grounds<\/button><\/span><span class=\"chip\">pp. 16–20<\/span><\/div>\n  <div class=\"slot\"><span class=\"t\">35 min<\/span><span><button class=\"btn ghost\" style=\"padding:4px 10px;font-size:14px\" data-view=\"r5\" type=\"button\">5 · Global animal law: scope, research programme, three proposals<\/button><\/span><span class=\"chip\">pp. 20–22<\/span><\/div>\n  <div class=\"slot brk\"><span class=\"t\">10 min<\/span><span>Break. Stand up, drink water, no phone scrolling.<\/span><span><\/span><\/div>\n  <div class=\"slot\"><span class=\"t\">35 min<\/span><span><button class=\"btn ghost\" style=\"padding:4px 10px;font-size:14px\" data-view=\"r6\" type=\"button\">6 · Method, Eurocentrism, the conclusion, and global justice<\/button><\/span><span class=\"chip\">pp. 22–23<\/span><\/div>\n  <div class=\"slot\"><span class=\"t\">10 min<\/span><span><button class=\"btn ghost\" style=\"padding:4px 10px;font-size:14px\" data-view=\"missed\" type=\"button\">Missed pile<\/button><\/span><span class=\"chip\">quiz<\/span><\/div>\n  <div class=\"slot\"><span class=\"t\">25 min<\/span><span><button class=\"btn ghost\" style=\"padding:4px 10px;font-size:14px\" data-view=\"mockA\" type=\"button\">Mock quiz A (paper, then mark)<\/button><\/span><span class=\"chip\">20 marks<\/span><\/div>\n<\/div>\n<div class=\"prose\">\n<h3>Answer habits that save marks<\/h3>\n<ul>\n<li>Use her words exactly: <b>global animal law<\/b>, <b>global or transnational (transboundary and multilevel)<\/b>, <b>animal welfare<\/b> against <b>animal rights<\/b>, <b>welfarism<\/b>, <b>unnecessary suffering<\/b>, <b>\"good-of-its-kind\" / \"good-of-its-own\"<\/b>, <b>secondary law<\/b>, <b>\"coherent and 'thick' body of law\"<\/b>, <b>leakage<\/b>, <b>race to the bottom<\/b>, <b>level the playing field<\/b>, <b>benchmark<\/b>, <b>overlapping consensus<\/b>, <b>animal turn<\/b>.<\/li>\n<li>Name the voice. \"Welfarism\" and \"animals should not suffer but do not have a right to life\" are <b>Garner<\/b>. \"Checklist ... no numbers, no prohibitions\" is <b>Favre<\/b>. \"A transnational animal protection regime does not exist at present\" is <b>Otter and co-authors<\/b>. \"Lack of a coherent legal regime\" is <b>White<\/b>. \"Ad hoc and piecemeal\" is <b>Bowman and co-authors<\/b>. \"Manifestations of the same overarching principle\" is <b>Sykes<\/b>. Universal principles built on Feminist Care Theory are <b>Kelch<\/b>'s. \"Swedes and Somalis\" is <b>Horta<\/b>. \"Infamously narrowly\" is <b>Peters<\/b> on the <i>EC – Biotech<\/i> Panel. The words \"unsettled\", \"side show\", \"brace\" and \"critical mass\" are <b>Peters's own<\/b>.<\/li>\n<li>Keep the dates apart: OIE standards <b>since 2005<\/b> (eleven sets), OIE Strategic Plan <b>2001–05<\/b>, Basel Declaration <b>2010<\/b>, <i>Herrmann<\/i> <b>2012<\/b>, Kuala Lumpur conference <b>2012<\/b>, <i>EC – Seal Products<\/i> Panel <b>2013<\/b>, <i>Tierbefreier<\/i> <b>2014<\/b>, <i>EC – Biotech<\/i> <b>2006<\/b>, <i>Airbus<\/i> <b>2011<\/b>, EU proposal to the WTO <b>2000<\/b>.<\/li>\n<li>For a 4-mark question, give the claim, the voice, one example from the text, and Peters's own verdict.<\/li>\n<\/ul>\n<h3>Coverage check<\/h3>\n<table><tr><th>Check<\/th><th>Result<\/th><\/tr>\n<tr><td>Source headings in lessons<\/td><td>7 of 7 (Abstract and the six numbered sections 1 to 6, whose headings the lessons use). The audit lists 6 \"headings\" and finds 6. Two of its six, \"In this context, a recent FAO report notes\" and \"Oscar Horta applies this reasoning to animals\", are lead-in lines to block quotes, not headings; both quotes are in the lessons (rounds 4 and 6)<\/td><\/tr>\n<tr><td>Cases, instruments, years<\/td><td>All 12 instruments, 2 main-text cases and 2 footnote cases found. 23 of 23 years found. The text names no jurist from the course's \"people in portrait\" list<\/td><\/tr>\n<tr><td>Footnotes<\/td><td>All 85 read and all 85 cited in the lessons. Pure bibliography is cited by author only (publisher, URL and page-range detail left out)<\/td><\/tr>\n<tr><td>Rounds, questions, mock<\/td><td>6 rounds, 83 questions (49 choose-one, 20 type-the-answer, 14 short answer), a 20-mark mock (counts from the build). Lessons run 1,265 to 1,745 words<\/td><\/tr><\/table>\n<p><b>Method.<\/b> Text extracted from the course PDF page by page under printed page numbers (PDF page plus 8; the PDF starts on printed p. 9). An inventory of every heading, term, instrument, case, person, date and footnote was built first and ticked against the lessons. <code>coverage_audit.py<\/code> was run on the lessons only (not the built page), and each flag was read against the lessons. A second script checked every quoted fragment in the lessons against the extract: the fragments it could not match were page-break joins, footnote numbers inside a quote, blanks in questions, or my own marked additions; four real slips were fixed (see below).<\/p>\n<p><b>First draft missed or got wrong (now fixed).<\/b> The German expert-council proposal in fn 61. The footnote references to fns 26, 27, 78 and 82 were not tagged. Three quotations were not verbatim: a spliced \"Today\" quotation on the three dimensions, a \"from being undermined\" quotation that dropped a bracket, and \"face\" for \"faces\" in the rights-objections line. A phrase, \"apply different methods\", was a paraphrase set in quotation marks and is now plain text.<\/p>\n<p><b>Left out on purpose.<\/b> Bibliographic detail of footnotes (publisher, edition, journal page range, URL, OJ reference) except where a name or date matters; the further reading on Garner (fn 10), Murphy and Baldwin et al. (fn 62) and the full text of the Directives (fn 41). The page is built for a short source of 15 pages, so it has 6 rounds of 1,265 to 1,745 words, all inside the 1,000 to 1,900 range.<\/p>\n<p><b>Limits.<\/b> The audit matches words, so paraphrase scores low; the low-scoring paragraphs (p. 10 symposium summaries, footnote URLs on pp. 13, 18 and 19) were read by hand against the lessons. The course lens answers in round 6 and the notes marked \"Not in Peters\" are my own, and the course file has no Peters entry yet. <code>render_check.py<\/code> at 1360 and 400 px: 0 FAIL, 0 NOTE, every button clicked, no console errors.<\/p>\n<p><b>Source misprints and quirks kept and marked.<\/b> Cross-references: \"Kelch, n. 2\" [n. 3] in fns 16, 52, 56 and 79, and \"Sykes, n. 3\" [n. 2] in fns 21, 24, 29 and 84. Fn 20 title \"International Welfare\" [animal welfare]. Fn 33 Bern Convention signed \"19 Sept. 1982\" but in force \"1 June 1982\". Fn 62 \"In the 1980s, in response to the Watergate scandal\". Fn 85 \"Finish\" [Finnish]. The text calls the wildlife-law book \"Lyster's Wildlife Law\" (full title in fn 18: <i>Lyster's International Wildlife Law<\/i>), and says European norms date \"mainly since the 1980s\" while fns 41–44 give 1968 to 1987.<\/p>\n\n<p class=\"foot-note\">AI-generated study aid for private revision only. Not for submission. INT301 AI rule: AIAS Level 2. Source: Peters, A., \"Global Animal Law: What It Is and Why We Need It\", <i>Transnational Environmental Law<\/i> 5(1) (2016) 9–23, doi:10.1017/S2047102516000066. Text extracted from the course PDF; page numbers are the printed ones.<\/p>\n<\/div>", "planTitle": "Learn a round, quiz it, fix the misses, move on"};
const KEY = "int301drill.peters.v1";
const blank = () => ({ rounds: {}, missed: [], mocks: {} });
let S = blank();
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const strip = s => String(s).replace(/<[^>]+>/g, "");
const roundById = id => DATA.rounds.find(r => r.id === id);
const qByKey = k => { const [rid, i] = k.split(":"); return roundById(rid).quiz[+i]; };
const main = $("#main");

// ---------- navigation
const VIEWS = [{ id: "plan", label: "Study plan", group: "start", n: "—" }]
  .concat(DATA.rounds.map((r, i) => ({ id: r.id, label: r.title, group: "rounds", n: String(i + 1) })))
  .concat([{ id: "missed", label: "Missed pile", group: "test", n: "↺" }],
          DATA.mocks.map(m => ({ id: m.id, label: m.title, group: "test", n: String(m.qs.reduce((a, q) => a + q.m, 0)) })));
const mockTotal = m => m.qs.reduce((a, q) => a + q.m, 0);

function chipFor(v) {
  const r = S.rounds[v.id];
  if (v.id === "missed") return `<span class="chip ${S.missed.length ? "low" : ""}">${S.missed.length} left</span>`;
  if (v.id.startsWith("mock")) { const m = S.mocks[v.id], tot = mockTotal(DATA.mocks.find(x => x.id === v.id)); return m && m.total != null ? `<span class="chip ${m.total >= .7 * tot ? "ok" : "low"}">${m.total}/${tot}</span>` : `<span class="chip">to do</span>`; }
  if (v.id === "plan") return "";
  if (r && r.best != null) { const pct = r.best / r.of; return `<span class="chip ${pct >= .8 ? "ok" : "low"}">${r.best}/${r.of}</span>`; }
  if (r && r.learned) return `<span class="chip learned">learned</span>`;
  return `<span class="chip">to do</span>`;
}
function renderNav(cur) {
  for (const g of ["start", "rounds", "test"]) {
    $("#nav-" + g).innerHTML = VIEWS.filter(v => v.group === g).map(v =>
      `<button class="navbtn" type="button" data-view="${v.id}" ${v.id === cur ? 'aria-current="page"' : ""}><span class="n">${v.n}</span><span>${esc(v.label)}</span>${chipFor(v)}</button>`).join("");
  }
  const done = DATA.rounds.filter(r => S.rounds[r.id] && S.rounds[r.id].best != null).length;
  $("#overall").innerHTML = `<b>${done}/${DATA.rounds.length}</b> rounds quizzed`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) go(b.dataset.view, b.dataset.tab); });

let current = "plan";
let booted = false;
function go(id, tab) {
  current = id;
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  if (id === "plan") renderPlan();
  else if (id === "missed") startQuiz("missed", S.missed.slice());
  else if (id.startsWith("mock")) renderMock(DATA.mocks.find(m => m.id === id));
  else renderRound(roundById(id), tab || "learn");
  renderNav(id);
  main.focus({ preventScroll: true });
  if (booted && window.innerWidth <= 860) main.scrollIntoView({ block: "start" });
  else if (booted) window.scrollTo({ top: 0 });
  booted = true;
}

// ---------- plan
function renderPlan() {
  main.innerHTML = `<div class="eyebrow">Study plan</div><h2>${DATA.planTitle}</h2>${DATA.plan}`;
}

// ---------- round
function renderRound(r, tab) {
  const idx = DATA.rounds.indexOf(r);
  main.innerHTML = `
    <div class="eyebrow">Round ${idx + 1} of ${DATA.rounds.length} · ${esc(r.mins)} min</div>
    <h2>${esc(r.title)}</h2>
    <div class="src">From: ${esc(r.src)}</div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" aria-selected="${tab === "learn"}" data-view="${r.id}" data-tab="learn">Learn</button>
      <button class="tab" role="tab" type="button" aria-selected="${tab === "quiz"}" data-view="${r.id}" data-tab="quiz">Quiz · ${r.quiz.length}</button>
    </div>
    <div id="pane"></div>`;
  if (tab === "learn") {
    $("#pane").innerHTML = `<div class="notes">${r.notes}</div>
      <div class="row"><button class="btn" id="toQuiz" type="button">I've read it. Start the quiz</button></div>`;
    $("#toQuiz").onclick = () => {
      S.rounds[r.id] = Object.assign(S.rounds[r.id] || {}, { learned: true }); save();
      go(r.id, "quiz");
    };
  } else startQuiz(r.id, r.quiz.map((_, i) => r.id + ":" + i), $("#pane"));
}

// ---------- quiz engine
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"').replace(/&/g, " and ")
  .replace(/[^a-z0-9]+/g, " ").replace(/\b(the|a|an)\b/g, " ").replace(/\s+/g, " ").trim();

function startQuiz(scope, keys, host) {
  host = host || main;
  if (scope === "missed") {
    main.innerHTML = `<div class="eyebrow">Review</div><h2>Missed pile</h2>
      <div class="src">Every question you got wrong, from all rounds. A right answer removes it.</div><div id="pane"></div>`;
    host = $("#pane");
    if (!keys.length) {
      host.innerHTML = `<p class="prose" style="margin-top:18px">The pile is empty. Questions you miss in any round land here.</p>
        <div class="row"><button class="btn" data-view="plan" type="button">Back to the plan</button></div>`;
      return;
    }
  }
  const st = { keys, i: 0, right: 0, wrong: [] };
  const step = () => {
    if (st.i >= st.keys.length) return finish();
    const k = st.keys[st.i], q = qByKey(k);
    const kind = { mcq: "Choose one", fill: "Type the answer", short: "Write a short answer" }[q.t];
    const from = scope === "missed" ? ` · from round ${DATA.rounds.findIndex(r => r.id === k.split(":")[0]) + 1}` : "";
    host.innerHTML = `
      <div class="qhead"><span>Question ${st.i + 1} / ${st.keys.length}${from}</span><span>${st.right} right</span></div>
      <div class="bar"><i style="width:${st.i / st.keys.length * 100}%"></i></div>
      <div class="kind">${kind}</div>
      <div class="qtext">${q.q}</div>
      <div id="ans"></div><div id="fbHost"></div>`;
    requestAnimationFrame(() => { const b = $(".bar i", host); if (b) b.style.width = ((st.i + 1) / st.keys.length * 100) + "%"; });
    const ans = $("#ans", host), fbHost = $("#fbHost", host);
    const mark = ok => {
      if (ok) { st.right++; S.missed = S.missed.filter(x => x !== k); }
      else { st.wrong.push(k); if (!S.missed.includes(k)) S.missed.push(k); }
      save(); renderNav(current);
    };
    const feedback = (cls, title, body, next = true) => {
      fbHost.innerHTML = `<div class="fb ${cls} enter"><strong>${title}</strong>${body}</div>
        ${next ? `<div class="row"><button class="btn" id="nextQ" type="button">${st.i + 1 < st.keys.length ? "Next question" : "See score"}</button></div>` : ""}`;
      requestAnimationFrame(() => requestAnimationFrame(() => { const f = $(".fb", fbHost); if (f) f.classList.remove("enter"); }));
      const n = $("#nextQ", fbHost);
      if (n) { n.onclick = () => { st.i++; step(); }; n.focus({ preventScroll: true }); }
    };
    const why = q.ex ? `<div class="ex">${q.ex}</div>` : "";

    if (q.t === "mcq") {
      ans.innerHTML = `<div class="opts">${q.opts.map((o, j) => `<button class="opt" type="button" data-j="${j}">${o}</button>`).join("")}</div>`;
      ans.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        const j = +b.dataset.j, ok = j === q.a;
        ans.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.j === q.a) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        mark(ok);
        feedback(ok ? "good" : "bad", ok ? "Right." : "Not quite.", why);
      });
    } else if (q.t === "fill") {
      ans.innerHTML = `<input id="fillIn" type="text" spellcheck="false" autocomplete="off" placeholder="Type your answer">
        <div class="row"><button class="btn" id="chk" type="button">Check</button><span class="src">Enter also checks. Case and punctuation don't matter.</span></div>`;
      const inp = $("#fillIn", ans);
      inp.focus({ preventScroll: true });
      const check = () => {
        if (!inp.value.trim()) return;
        const v = norm(inp.value), ok = [q.a].concat(q.acc || []).some(x => norm(x) === v);
        inp.readOnly = true; $("#chk", ans).disabled = true;
        const shown = `<div class="ansbox">${q.a}</div>`;
        if (ok) { mark(true); feedback("good", "Right.", shown + why); return; }
        feedback("bad", "Not a match. The answer:", shown + (q.acc && q.acc.length ? `<div class="accepted">Also accepted: ${q.acc.map(esc).join(" · ")}</div>` : "") + why +
          `<div class="row"><button class="btn ghost" id="override" type="button">Mine meant the same thing</button></div>`);
        let counted = false;
        const commit = ok2 => { if (!counted) { counted = true; mark(ok2); } };
        $("#override", fbHost).onclick = () => { commit(true); st.i++; step(); };
        $("#nextQ", fbHost).onclick = () => { commit(false); st.i++; step(); };
      };
      $("#chk", ans).onclick = check;
      inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (!inp.readOnly) check(); } };
    } else {
      ans.innerHTML = `<textarea id="shortIn" rows="6" spellcheck="true" placeholder="Write your answer here (or on paper), then reveal the model answer"></textarea>
        <div class="row"><button class="btn" id="reveal" type="button">Show model answer</button></div>`;
      $("#reveal", ans).onclick = () => {
        $("#reveal", ans).disabled = true;
        feedback("neutral", "Model answer. Mark yourself honestly.", `<div class="model">${q.a}</div>` + why +
          `<div class="row"><button class="btn good" id="gotIt" type="button">I got the key points</button><button class="btn bad" id="missIt" type="button">I missed parts</button></div>`, false);
        $("#gotIt", fbHost).onclick = () => { mark(true); st.i++; step(); };
        $("#missIt", fbHost).onclick = () => { mark(false); st.i++; step(); };
      };
    }
  };
  const finish = () => {
    const r = roundById(scope);
    if (r && st.keys.length === r.quiz.length) {
      const rec = S.rounds[r.id] = Object.assign(S.rounds[r.id] || {}, { learned: true, of: r.quiz.length });
      rec.best = Math.max(rec.best || 0, st.right); save(); renderNav(current);
    }
    const idx = r ? DATA.rounds.indexOf(r) : -1;
    const next = idx >= 0 && idx < DATA.rounds.length - 1 ? DATA.rounds[idx + 1] : null;
    const pct = st.right / st.keys.length;
    host.innerHTML = `
      <div class="score">${st.right}<small> / ${st.keys.length}</small></div>
      <p class="prose">${pct === 1 ? "Clean round. Move on." : pct >= .8 ? "Solid. Retry the misses once, then move on." : "Retry the misses now. Reread the matching part of the notes first if the same idea failed twice."}</p>
      ${st.wrong.length ? `<ul class="missed">${st.wrong.map(k => `<li>${esc(strip(qByKey(k).q))}</li>`).join("")}</ul>` : ""}
      <div class="row">
        ${st.wrong.length ? `<button class="btn" id="retry" type="button">Retry missed (${st.wrong.length})</button>` : ""}
        ${next ? `<button class="btn ${st.wrong.length ? "ghost" : ""}" data-view="${next.id}" type="button">Round ${idx + 2}: ${esc(next.title)}</button>` : ""}
        ${r ? `<button class="btn ghost" data-view="${r.id}" data-tab="learn" type="button">Back to notes</button>` : `<button class="btn ghost" data-view="plan" type="button">Back to the plan</button>`}
      </div>`;
    const rb = $("#retry", host);
    if (rb) rb.onclick = () => startQuiz(scope, st.wrong.slice(), scope === "missed" ? null : host);
  };
  step();
}

// ---------- mock paper
function renderMock(m) {
  const rec = S.mocks[m.id] = S.mocks[m.id] || { marks: {} };
  const draft = rec.draft || {};
  const tot = mockTotal(m);
  main.innerHTML = `
    <div class="eyebrow">Mock quiz · ${esc(m.when)} · ${tot} marks · ${esc(m.mins)} minutes</div>
    <h2>${esc(m.title)}</h2>
    <p class="prose">Like the real surprise quizzes: who argued what, key terms, cases and resolutions. Set a ${esc(m.mins)}-minute timer, close the notes, and write your answers on paper or below. Then show the answers and mark each question with the rubric.</p>
    <div id="paper">${m.qs.map((q, i) => `
      <div class="mq">
        <div class="mk">Q${i + 1} · ${q.m} mark${q.m > 1 ? "s" : ""}</div>
        <div class="qtext" style="margin-top:6px">${q.q}</div>
        <textarea id="${m.id}-a${i}" rows="${q.m > 2 ? 6 : 2}" spellcheck="true" data-i="${i}">${esc(draft[i] || "")}</textarea>
        <div class="key" hidden>
          <div class="fb neutral"><strong>Model answer</strong><div class="model">${q.a}</div>${q.rubric ? `<div style="margin-top:8px"><b>Rubric:</b> ${q.rubric}</div>` : ""}</div>
          <div class="marks">Your marks:${Array.from({ length: q.m + 1 }, (_, v) => `<button type="button" data-q="${i}" data-v="${v}" aria-pressed="${rec.marks[i] === v}">${v}</button>`).join("")}</div>
        </div>
      </div>`).join("")}</div>
    <div class="row"><button class="btn" id="showKey" type="button">Show answers and mark</button><span id="tot" class="src"></span></div>`;
  const total = () => {
    const vals = m.qs.map((_, i) => rec.marks[i]);
    const done = vals.every(v => v != null);
    rec.total = done ? vals.reduce((a, b) => a + b, 0) : null; save(); renderNav(current);
    $("#tot").innerHTML = done ? `<b style="color:var(--ink);font-size:18px">${rec.total} / ${tot}</b> ${rec.total >= .8 * tot ? "· Ready." : "· Redo the rounds behind the lost marks."}` : "Mark every question to see the total.";
  };
  main.querySelectorAll("textarea").forEach(t => t.oninput = () => { rec.draft = rec.draft || {}; rec.draft[t.dataset.i] = t.value; save(); });
  $("#showKey").onclick = () => { main.querySelectorAll(".key").forEach(k => k.hidden = false); $("#showKey").hidden = true; total(); };
  main.querySelectorAll(".marks button").forEach(b => b.onclick = () => {
    rec.marks[b.dataset.q] = +b.dataset.v;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    total();
  });
  if (Object.keys(rec.marks).length) { main.querySelectorAll(".key").forEach(k => k.hidden = false); $("#showKey").hidden = true; total(); }
}

// ---------- reset dialog

go(VIEWS.some(v => v.id === start) ? start : "plan");
