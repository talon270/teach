<style>
/* Layout: neobrutalist study notebook. Cream page, white slabs with 3px black borders and hard
   offset shadows, red as the single accent. Sticky round list left (stacks on phones). */
:root {
  --bg: #f8efd9; --surface: #ffffff; --surface-2: #fffaf0; --ink: #111111; --muted: #4a443b;
  --line: #111111; --shadow: #111111; --accent: #e23a28; --accent-ink: #ffffff; --accent-soft: #ffd9cf;
  --hl: #e23a28; --good: #111111; --good-bg: #ffffff; --bad: #c42a19; --bad-bg: #ffd9cf;
  --term: #111111; --term-ink: #f8efd9; --scrim: rgba(17, 17, 17, .6); --dialog: #ffffff;
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: light; --bw: 3px; --sh: 5px 5px 0 var(--shadow); --sh-sm: 3px 3px 0 var(--shadow);
  --spring: linear(0, .21 6%, .62 15%, .9 25%, 1.03 35%, 1.05 43%, 1.02 55%, 1 70%, 1);
}
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 28px }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-bottom: 18px; border-bottom: var(--bw) solid var(--line) }
.eyebrow { font: 700 12px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
h1 { font: 400 clamp(34px, 6vw, 58px)/1 var(--display); margin: 10px 0 0; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance }
h1 span { background: var(--accent); color: var(--accent-ink); padding: 0 .14em; border: var(--bw) solid var(--line); box-shadow: var(--sh-sm); display: inline-block; transform: rotate(-1.5deg); margin-right: .1em }
.meta { color: var(--ink); font: 600 13px/1 var(--mono); display: flex; flex-wrap: wrap; gap: 8px }
.meta > span { border: 2px solid var(--line); background: var(--surface); padding: 7px 10px }
.meta b { font-weight: 800 }

.cols { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; align-items: start }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr) } nav { position: static !important } }
nav { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; gap: 20px }
.navgroup { display: grid; gap: 6px }
.navgroup h4 { font: 800 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 2px }
.navlist { display: grid; gap: 6px }
.navbtn { all: unset; box-sizing: border-box; cursor: pointer; display: grid; width: 100%; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 8px 10px; font-size: 14.5px; font-weight: 500; border: 2px solid transparent; transition: transform .35s var(--spring), box-shadow .35s var(--spring), background-color .1s }
.navbtn:hover { border-color: var(--line); background: var(--surface) }
.navbtn[aria-current="page"] { background: var(--surface); border-color: var(--line); box-shadow: var(--sh-sm); font-weight: 700; transform: translate(-2px, -2px) }
.navbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.navbtn .n { font: 800 12px/1 var(--mono); color: var(--muted) }
.chip { font: 700 11px/1 var(--mono); padding: 4px 7px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: .03em }
.chip:empty { display: none }
.chip.learned { background: var(--surface-2) }
.chip.ok { background: var(--ink); color: var(--bg) }
.chip.low { background: var(--accent); color: var(--accent-ink) }
@media (max-width: 860px) { .navlist { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)) } }

main:focus { outline: none }
main { min-width: 0; background: var(--surface); border: var(--bw) solid var(--line); box-shadow: 8px 8px 0 var(--shadow); padding: clamp(18px, 3.5vw, 36px) }
main h2 { font: 400 clamp(24px, 3.6vw, 34px)/1.1 var(--display); margin: 8px 0 8px; text-transform: uppercase; text-wrap: balance }
main h3 { font: 800 19px/1.3 var(--body); margin: 32px 0 10px; text-wrap: balance; display: inline-block; border-bottom: 4px solid var(--accent); padding-bottom: 2px }
.src { color: var(--muted); font-size: 13.5px }
.notes, .prose { max-width: 72ch }
.notes ul, .prose ul, .prose ol { padding-left: 1.2em; margin: 8px 0 }
.notes li, .prose li { margin: 4px 0 }
.notes li::marker, .prose li::marker { color: var(--accent); font-weight: 800 }
code { font: 500 .88em/1.5 var(--mono); background: var(--surface-2); padding: .05em .35em; border: 1.5px solid var(--line); overflow-wrap: anywhere }
pre { margin: 12px 0; overflow-x: auto; position: relative; padding: 12px 14px 12px 54px; font: 400 13.5px/1.6 var(--mono); max-width: 100%; border: var(--bw) solid var(--line) }
pre code { background: none; padding: 0; border: 0; font-size: inherit; overflow-wrap: normal; white-space: pre }
pre::before { position: absolute; left: 0; top: 0; bottom: 0; width: 40px; padding-top: 12px; text-align: center; font: 800 11px/1.6 var(--mono); border-right: 2px solid var(--line) }
pre.code { background: var(--surface-2); box-shadow: var(--sh-sm) }
pre.code::before { content: "IN"; background: var(--surface); color: var(--ink) }
pre.out { background: var(--term); color: var(--term-ink); margin-top: -4px; box-shadow: var(--sh-sm) }
pre.out::before { content: "OUT"; background: var(--accent); color: var(--accent-ink); border-color: var(--line) }
table { border-collapse: collapse; margin: 12px 0; font-size: 14.5px; display: block; overflow-x: auto; max-width: 100%; border: var(--bw) solid var(--line) }
th, td { text-align: left; padding: 8px 14px; border-bottom: 2px solid var(--line); vertical-align: top }
th { font: 800 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .05em; background: var(--ink); color: var(--bg) }
tr:last-child td { border-bottom: 0 }
td code { white-space: nowrap; overflow-wrap: normal }
.tip { background: var(--surface-2); border: var(--bw) solid var(--line); box-shadow: var(--sh-sm); padding: 12px 16px; font-size: 15px }
.warn { background: var(--accent-soft); border: var(--bw) solid var(--line); border-left-width: 10px; border-left-color: var(--accent); padding: 12px 16px; font-size: 15px; margin: 16px 0; box-shadow: var(--sh-sm) }
.warn b:first-child { color: var(--bad); text-transform: uppercase; font-family: var(--mono); letter-spacing: .03em }

.tabs { display: flex; gap: 8px; margin: 20px 0 6px; border-bottom: var(--bw) solid var(--line) }
.tab { all: unset; cursor: pointer; padding: 9px 16px; font: 800 14px/1.2 var(--body); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border: var(--bw) solid transparent; border-bottom: 0; margin-bottom: -3px }
.tab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--line) }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

.btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border: var(--bw) solid var(--line);
  font: 800 14.5px/1.2 var(--body); text-transform: uppercase; letter-spacing: .03em; background: var(--accent); color: var(--accent-ink); box-shadow: var(--sh);
  transition: transform .35s var(--spring), box-shadow .35s var(--spring) }
.btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--shadow) }
.btn:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--shadow); transition-duration: .06s }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px }
.btn.ghost { background: var(--surface); color: var(--ink) }
.btn.good { background: var(--ink); color: var(--bg) }
.btn.bad { background: var(--accent); color: var(--accent-ink) }
.btn[disabled] { opacity: .45; pointer-events: none; box-shadow: none }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 18px }

.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; font: 700 13px/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; text-transform: uppercase }
.bar { height: 14px; background: var(--surface); border: var(--bw) solid var(--line); margin-top: 10px }
.bar i { display: block; height: 100%; background: var(--accent); border-right: var(--bw) solid var(--line); transition: width .5s var(--spring) }
.bar i[style*="width:0"] { border-right: 0 }
.kind { display: inline-block; font: 800 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 6px 8px; margin: 24px 0 10px }
.qtext { font-size: 18px; font-weight: 600; max-width: 68ch }
.opts { display: grid; gap: 10px; margin-top: 16px; max-width: 640px }
.opt { all: unset; cursor: pointer; padding: 11px 14px; border: var(--bw) solid var(--line); background: var(--surface); box-shadow: var(--sh-sm); font-size: 15.5px; font-weight: 500;
  transition: transform .35s var(--spring), box-shadow .35s var(--spring), background-color .1s }
.opt:hover { background: var(--surface-2); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow) }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.opt.right { background: var(--ink); color: var(--bg) }

textarea, input[type="text"] { width: 100%; max-width: 640px; display: block; margin-top: 16px; padding: 10px 12px; border: var(--bw) solid var(--line); border-radius: 0;
  background: var(--surface-2); color: var(--ink); font: 400 14px/1.55 var(--mono); resize: vertical; box-shadow: inset 3px 3px 0 rgba(0, 0, 0, .08) }

  transition: opacity .3s ease-out, transform .5s var(--spring) }

.sched { display: grid; margin: 14px 0; max-width: 760px; border: var(--bw) solid var(--line); box-shadow: var(--sh); background: var(--surface) }

.slot.day { background: var(--ink); color: var(--bg); font: 800 13px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; grid-template-columns: 1fr; padding: 12px 14px }

dialog { border: var(--bw) solid var(--line); box-shadow: 8px 8px 0 var(--shadow); padding: 24px; background: var(--dialog); color: var(--ink); max-width: min(420px, calc(100vw - 32px)) }

code, pre, textarea, input { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0 }  /* show == and != as typed */

@supports (corner-shape: squircle) {

mark { background: var(--accent-soft); color: var(--ink); padding: 0 .15em; box-shadow: inset 0 -3px 0 var(--accent) }

.foot-note { color: var(--muted); font-size: 12.5px; max-width: 72ch; margin-top: 30px; border-top: 2px solid var(--line); padding-top: 10px }

  </header>

      <div class="navgroup"><h4>Start here</h4><div class="navlist" id="nav-start"></div></div>

<script>
const DATA = {"rounds": [{"id": "r1", "quiz": [{"t": "mcq", "q": "What is Peters's starting hypothesis in the abstract?", "opts": ["Animals should be given legal personhood in every state", "Animal welfare is already a binding rule of customary international law", "Contemporary animal law must be global or transnational to be effective", "International trade law should be replaced by animal-welfare law"], "a": 2, "ex": "<p>\"[C]ontemporary animal law must be global or transnational (that is, both transboundary and multilevel) in order to be effective\" (p. 9). Whether welfare is already a binding principle is called \"unsettled\" in section 3, not her starting claim; and she never proposes replacing trade law.<\/p>"}, {"t": "mcq", "q": "Which symposium article argues that international trade law can make animal protection a legitimate exception to free-trade obligations?", "opts": ["Kelch", "Garner", "Sykes", "Peters, \"Liberté, Égalité, Animalité\""], "a": 2, "ex": "<p>Katie Sykes (p. 10, fn 2). Kelch proposes universal principles from Feminist Care Theory; Peters's own article is about the human–animal boundary and the legal gap; Garner is the welfarist political scientist in section 2.<\/p>"}, {"t": "mcq", "q": "Kelch's proposed method for universal principles of animal advocacy is based on:", "opts": ["Legal positivism", "Natural law", "Third World Approaches to International Law", "Feminist Care Theory"], "a": 3, "ex": "<p>\"[B]ased on Feminist Care Theory, the fundamental notion of which is the concept of caring\" (p. 10, fn 3). The other three are course approaches, but Peters does not tie Kelch to any of them.<\/p>"}, {"t": "short", "q": "What does Peters's own symposium article, \"Liberté, Égalité, Animalité\", say about the boundary between humans and animals and about a \"legal gap\"?", "a": "<p>The boundary is \"socially constructed\", has been shifting and seems blurry, so there is a <b>continuum<\/b> between humans and animals (p. 10). The legal gap is between the wealth of (international) law serving human needs and rights and the \"glaring international regulatory deficit\" on animal welfare, especially the ascription of \"rights\". This contrasts with the historic parallels and intertwinement of the legal discourse on humans and animals, and seeing them may help law combat violence against animals.<\/p>", "ex": "<p><b>Marks.<\/b> Boundary constructed and blurry, continuum (1); gap between human-serving law and animal welfare deficit (1); parallels and entanglement of the two discourses help law fight violence against animals (1). p. 10, fn 1.<\/p>"}, {"t": "fill", "q": "Welfare first emerged as a ______ concept, and veterinary medicine initially shaped it.", "a": "scientific", "acc": ["scientific concept"], "ex": "<p>\"Animal welfare first emerged as a scientific concept\" (p. 10, fn 5); veterinary medicine \"initially shaped\" it (p. 11). The ethical dimension \"has come to the foreground\" only recently.<\/p>"}, {"t": "mcq", "q": "What is the objective of refining and applying a concept of animal welfare?", "opts": ["To transfer animal regulation from states to the OIE", "To give animals a right to life", "To mitigate animal suffering while preserving their economic use by humans", "To end the economic use of animals by humans"], "a": 2, "ex": "<p>p. 11. Ending use and a right to life are the animal-rights position, which welfarism does not take (fns 11–14). The OIE enters in section 4.<\/p>"}, {"t": "fill", "q": "The British Farm Animal Welfare Council developed the \"five ______\" for animals.", "a": "freedoms", "ex": "<p>Starting in the 1960s (p. 11, fn 6, Brambell Report 1965): freedom from hunger and thirst; from discomfort; from injury, pain and disease; to express normal behaviour; from fear and distress.<\/p>"}, {"t": "mcq", "q": "Which of these is <b>not<\/b> one of the five freedoms?", "opts": ["Freedom from hunger and thirst", "Freedom from fear and distress", "Freedom to express normal behaviour", "Freedom from the property status of being owned"], "a": 3, "ex": "<p>The five freedoms do not touch ownership; welfarism \"does not challenge the property status of animals\" (p. 11, fn 12). The other three options are on the list (p. 11).<\/p>"}, {"t": "mcq", "q": "Which set gives the three overlapping dimensions to which animal welfare is usually related today?", "opts": ["Basic health and functioning; affective state; natural living", "Wild animals; farm animals; animals used in experiments", "Food, water, shelter", "Species protection; habitat protection; biodiversity"], "a": 0, "ex": "<p>p. 11. Species, habitat and biodiversity are the three areas that existing international instruments cover (p. 13, round 2). Wild, farm and experiment animals are the three <i>sets of law<\/i> (p. 13).<\/p>"}, {"t": "mcq", "q": "What does Peters, citing Fraser (fn 9), say about the criteria used to measure welfare?", "opts": ["They are fully objective and agreed across veterinary science", "They do not always agree with each other, and \"welfare\" is underlain with values", "They were fixed by the OIE in 2005", "They apply only to laboratory animals"], "a": 1, "ex": "<p>\"[T]he different criteria invoked do not always agree with each other, or are even incommensurate\"; \"'Welfare' is not a purely 'scientific' concept but is underlain with values\" (fn 9, p. 11). Fraser is cited \"critically\", against the idea of purely numerical scores.<\/p>"}, {"t": "short", "q": "Define welfarism as Peters reports Garner, and state its practical consequence for the use of animals.", "a": "<p>Welfarism is the position that animals should not suffer but do not have a right to life (Garner, fn 11). \"Animal welfare does not challenge the property status of animals\" (fn 12). Key concepts are the principle of animal welfare and \"unnecessary suffering\", not rights (fn 13). So \"[u]sing animals, per se, ... is not the problem. It is what they are used for that is the key\" (fn 14) (p. 11).<\/p>", "ex": "<p><b>Marks.<\/b> No right to life, no suffering (1); property status unchallenged / unnecessary suffering as key concept (1); the use is not the problem, what for is (1). p. 11, fns 11–14.<\/p>"}, {"t": "fill", "q": "In the welfarist account, key concepts are not rights but the idea of \"______ suffering\".", "a": "unnecessary", "ex": "\"[T]he principle of animal welfare and the associated idea of unnecessary suffering\" (p. 11, fn 13)."}, {"t": "mcq", "q": "Garner, whose definition of welfarism Peters quotes, is described as a:", "opts": ["veterinary scientist", "political scientist", "Judge of the European Court of Human Rights", "WTO panellist"], "a": 1, "ex": "<p>\"[O]ne of its proponents, political scientist Robert Garner\" (p. 11). Veterinary medicine shaped the <i>scientific<\/i> concept; the judge in section 3 is Pinto de Albuquerque (p. 12, fn 17).<\/p>"}], "notes": "<div class=\"lesson-map\"><b>What this round covers.<\/b> What the text is, what its starting claim is, how the foreword is laid out, what the other three symposium articles argue, and what \"animal welfare\" means (the five freedoms, the three dimensions, welfarism against animal rights).\n<ol><li>The text and the author<\/li><li>The abstract: the starting hypothesis<\/li><li>1. Introduction: the six-step route<\/li><li>The three symposium articles<\/li><li>2. Animal welfare as a concept: a scientific origin<\/li><li>The five freedoms and the three dimensions<\/li><li>Measuring welfare, and a doubt about it (fn 9)<\/li><li>Welfarism against animal rights<\/li><\/ol><\/div>\n\n<h3>1. The text<\/h3>\n<p>Anne Peters, \"Global Animal Law: What It Is and Why We Need It\", <i>Transnational Environmental Law<\/i> 5:1 (2016), pp. 9–23, doi:10.1017/S2047102516000066. It is headed <b>\"Symposium Foreword\"<\/b>: it frames the three articles that follow it in the same issue <span class=\"pg\">p. 9<\/span>. Peters is at the <b>Max Planck Institute for Comparative Public Law and International Law, Heidelberg<\/b>, and also at the Universities of Heidelberg and Basel and the Freie Universität Berlin <span class=\"fnm\">fn *<\/span>. The abstract says the collection has \"four articles including this framing article\". The foreword itself introduces \"three symposium articles\" and \"sketches out the research programme\" of the new field.<\/p>\n<div class=\"notin\">Not in Peters: the course lens fits her as \"global law\" or \"transnational law\" scholarship, not as realist, TWAIL or Marxist. She does name Eurocentrism and a North–South divide as risks (round 6). No tutorial portrait jurist (Kelsen, Schmitt, Lauterpacht and the rest) is mentioned in the text.<\/div>\n\n<h3>2. The abstract<\/h3>\n<p>The collection seeks \"to conceptualize and flesh out a <b>new branch of law and legal research: global animal law<\/b>\" <span class=\"pg\">p. 9<\/span>. <mark>The starting hypothesis: \"contemporary animal law must be <b>global or transnational<\/b> (that is, both <b>transboundary and multilevel<\/b>) in order to be effective.\"<\/mark><\/p>\n<ul>\n<li>\"In times of globalization, all aspects of (commodified) human−animal interactions\" have a transboundary dimension. The abstract lists <b>food production and distribution, working animals and uses in research, to breeding and keeping of pets<\/b>.<\/li>\n<li>\"Animal welfare has become a global concern, which requires global regulation.\"<\/li>\n<li>The foreword also \"links its emergence to the ongoing 'animal turn' in the social sciences, including political philosophy\".<\/li>\n<\/ul>\n<p>The keywords name the actors: animal welfare, globalization, transnational law, the <b>World Organisation for Animal Health (OIE)<\/b>, <b>CITES<\/b> (the Convention on International Trade in Endangered Species of Wild Fauna and Flora) and the <b>World Trade Organization (WTO)<\/b> <span class=\"pg\">p. 9<\/span>.<\/p>\n\n<h3>3. \"1. Introduction\": the route of the argument<\/h3>\n<p>The foreword \"lays the conceptual foundations\" for the three main articles. Its argument runs in six steps, one per section <span class=\"pg\">p. 9<\/span>:<\/p>\n<table><tr><th>Section<\/th><th>Claim<\/th><\/tr>\n<tr><td>2<\/td><td>Animal welfare is a <b>multifaceted concept<\/b> (explained first)<\/td><\/tr>\n<tr><td>3<\/td><td>Animal welfare has become a <b>global concern<\/b><\/td><\/tr>\n<tr><td>4<\/td><td>Despite global awareness, <b>regulation is largely missing<\/b>, especially at the international level<\/td><\/tr>\n<tr><td>5<\/td><td>Effective regulation would need to be <b>global in structure and scope<\/b><\/td><\/tr>\n<tr><td>6<\/td><td>The accompanying field of research is <b>global animal law<\/b><\/td><\/tr><\/table>\n<p class=\"tip\"><b>Memorise the route:<\/b> concept, concern, gap, global answer, new field.<\/p>\n\n<h3>4. The three symposium articles<\/h3>\n<table><tr><th>Author and title<\/th><th>What it argues<\/th><\/tr>\n<tr><td><b>Peters<\/b>, \"Liberté, Égalité, Animalité: Human–Animal Comparisons in Law\" <span class=\"fnm\">fn 1<\/span> (pp. 25–53)<\/td><td>The \"socially constructed boundary between animals and humans has been shifting and seems blurry\". It exposes the tension in accepting a <b>continuum<\/b> between humans and animals, and the \"legal gap\" between the wealth of (international) law serving human needs and rights and the \"glaring international regulatory deficit\" for animal welfare. The gap, notably over \"rights\", contrasts with the \"historic parallels and intertwinement\" of legal discourse on humans and animals. Seeing these entanglements may help law in \"combating and ending violence against animals\" <span class=\"pg\">p. 10<\/span>. The idea of animal rights as \"strong moral and legal entitlements\" is explored in this article <span class=\"fnm\">fn 4<\/span>.<\/td><\/tr>\n<tr><td><b>Katie Sykes<\/b>, \"Globalization and the Animal Turn: How International Trade Law Contributes to Global Norms of Animal Protection\" <span class=\"fnm\">fn 2<\/span> (pp. 55–79)<\/td><td>International <b>trade law<\/b> is making a \"constructive contribution\" to global norms on animals in two ways. <b>First<\/b>, it lets states invoke animal protection as a potentially legitimate <b>exception to free-trade obligations<\/b>. <b>Second<\/b>, it strengthens cooperation in implementing and enforcing <b>conservation<\/b> obligations, for example through the new <b>Trans-Pacific Partnership's Environment Chapter<\/b> and its provisions on wildlife trafficking and endangered species <span class=\"pg\">p. 10<\/span>.<\/td><\/tr>\n<tr><td><b>Thomas Kelch<\/b>, \"Towards Universal Principles for Global Animal Advocacy\" <span class=\"fnm\">fn 3<\/span> (pp. 81–111)<\/td><td>Because animal uses are globalised, animal law \"must also respond globally\". To \"cross cultural boundaries\" a <b>common language<\/b> is needed. Kelch proposes a method to generate <b>universal principles<\/b> for advocacy and legal policy, based on <b>Feminist Care Theory<\/b>, \"the fundamental notion of which is the concept of <b>caring<\/b>\" <span class=\"pg\">p. 10<\/span>.<\/td><\/tr><\/table>\n<p class=\"warn\"><b>Trap.<\/b> Peters wrote the foreword <i>and<\/i> the first symposium article. Do not credit the trade-law article to her (it is Sykes) or the Feminist Care Theory article to her (it is Kelch).<\/p>\n<details class=\"check\"><summary>Check yourself: which two ways does Sykes say trade law builds global animal norms?<\/summary><p>(1) It lets states invoke animal protection as a potentially legitimate <b>exception<\/b> to free-trade obligations. (2) It enhances international <b>cooperation<\/b> in implementing and enforcing conservation obligations <span class=\"pg\">p. 10<\/span>.<\/p><\/details>\n\n<h3>5. \"2. Animal welfare as a concept\"<\/h3>\n<p>The articles use \"animal welfare\" and \"animal rights\" \"in various senses\", \"and are sometimes placed in contrast to each other\" <span class=\"pg\">p. 10<\/span>. <mark>Animal welfare \"first emerged as a <b>scientific concept<\/b>\"<\/mark> <span class=\"fnm\">fn 5<\/span> (Fraser, <i>Understanding Animal Welfare<\/i>, 2008). It relates to the <b>living and dying conditions of animals \"as they are kept, traded, and killed by humans\"<\/b>, \"based on the assumption that humans are, in principle, <b>morally entitled<\/b> to do all this with animals\" <span class=\"pg\">pp. 10–11<\/span>.<\/p>\n<p><mark>The objective is \"to <b>mitigate animal suffering while preserving their economic use<\/b> by humans\"<\/mark> <span class=\"pg\">p. 11<\/span>.<\/p>\n\n<h3>6. The five freedoms and the three dimensions<\/h3>\n<p>Starting in the <b>1960s<\/b>, the <b>British Farm Animal Welfare Council<\/b> developed the \"<b>five freedoms<\/b>\" <span class=\"pg\">p. 11<\/span>. Footnote 6 cites the <b>Brambell Report<\/b> (HMSO, 1965), s. 13, produced by the \"Technical Committee to Enquire into the Welfare of Animals Kept under Intensive Livestock Husbandry Systems\", chaired by Prof. F.W. Rogers Brambell <span class=\"fnm\">fn 6<\/span>.<\/p>\n<ol>\n<li>freedom from <b>hunger and thirst<\/b>;<\/li>\n<li>freedom from <b>discomfort<\/b>;<\/li>\n<li>freedom from <b>injury, pain, and disease<\/b>;<\/li>\n<li>freedom to <b>express normal behaviour<\/b>;<\/li>\n<li>freedom from <b>fear and distress<\/b>.<\/li><\/ol>\n<p>\"Today\", animal welfare \"is usually related to <b>three overlapping dimensions<\/b>\": the animal's <b>basic health and functioning<\/b>; its <b>affective state<\/b>; and its <b>natural living<\/b>. All three appear in \"international standards\" (the OIE, see round 3) <span class=\"fnm\">fn 7<\/span> and in domestic animal protection laws. Peters's example is <b>Art. 3 of the Swiss Animal Protection Statute<\/b> (<i>Tierschutzgesetz<\/i>, 16 Dec. 2005, as of 1 May 2014) <span class=\"fnm\">fn 8<\/span> <span class=\"pg\">p. 11<\/span>.<\/p>\n\n<h3>7. Measuring welfare, and a doubt<\/h3>\n<p><b>Veterinary medicine<\/b> \"initially shaped\" the scientific concept, with animal behaviour research, stress physiology, nutrition and genetics. Much energy went into identifying criteria and \"operationalize numerical scoring elements\" to \"measure\" the welfare of <b>livestock or laboratory animals<\/b> <span class=\"pg\">p. 11<\/span>.<\/p>\n<div class=\"view\" data-who=\"Fraser, as Peters cites him (fn 9)\"><p>Peters cites Fraser \"critically\" (pp. 239–40): the different criteria \"do not always agree with each other, or are even <b>incommensurate<\/b>\". <mark>\"Welfare\" is \"not a purely 'scientific' concept but is <b>underlain with values<\/b>\"<\/mark> (Fraser, p. 252) <span class=\"fnm\">fn 9<\/span>.<\/p><\/div>\n\n<h3>8. Welfarism against animal rights<\/h3>\n<p>\"Recently, the <b>ethical dimension<\/b> of the concept has come to the foreground.\" Animal welfare and its accompanying ethics of \"<b>welfarism<\/b>\" are \"often posited as the <b>counterpart to the idea of animal rights<\/b>\" <span class=\"fnm\">fn 10<\/span> <span class=\"pg\">p. 11<\/span>.<\/p>\n<div class=\"view\" data-who=\"Robert Garner (welfarist), as Peters reports him\"><p>Garner is a <b>political scientist<\/b>. He defines the welfarist ethic as the position that <mark>animals \"should not suffer but <b>do not have a right to life<\/b>\"<\/mark> <span class=\"fnm\">fn 11<\/span> (Francione & Garner, <i>The Animal Rights Debate: Abolition or Regulation?<\/i>, 2010, p. 120). Hence \"animal welfare does not challenge the <b>property status<\/b> of animals\" <span class=\"fnm\">fn 12<\/span> (p. 168). Key concepts are therefore not \"rights\" but \"the principle of animal welfare and the associated idea of <b>unnecessary suffering<\/b>\" <span class=\"fnm\">fn 13<\/span>. The practical consequence: \"[u]sing animals, per se, therefore, is not the problem. <b>It is what they are used for that is the key<\/b>\" <span class=\"fnm\">fn 14<\/span> (p. 129) <span class=\"pg\">p. 11<\/span>.<\/p><\/div>\n<p class=\"tip\"><b>Welfare against rights in one line:<\/b> welfare accepts the use of animals and limits suffering; rights would give animals strong entitlements (such as a right to life) and challenge their status as property. Peters returns to rights at the very end (round 6).<\/p>\n<details class=\"check\"><summary>Check yourself: what does welfarism leave unchanged?<\/summary><p>The <b>property status<\/b> of animals, and the human use of them. The question is \"what they are used for\", and whether the suffering is \"unnecessary\" <span class=\"pg\">p. 11<\/span>.<\/p><\/details>", "title": "The aim, the symposium, and welfare as a concept", "mins": "20 + 10", "src": "Abstract; \"1. Introduction\"; \"2. Animal Welfare as a Concept\", pp. 9–11 (fns *, 1–14)"}, {"id": "r2", "quiz": [{"t": "mcq", "q": "Which two motives does Peters name for the spread of concern for animal welfare in different regions?", "opts": ["Religious duty in Europe; economic aid in Asia", "Fear of disease in Europe; fear of war in Africa", "Food safety and consumer health in some regions; ethics or compassion in others", "Colonial administration and trade tariffs"], "a": 2, "ex": "<p>\"In some regions, concern for food safety and consumer health predominate; in other regions ethical considerations, or simply compassion, may prevail; mostly it seems to be a mixture of motives\" (p. 12, fns 15–16). Religion appears only later, as a factor behind attitudes (p. 22).<\/p>"}, {"t": "fill", "q": "Judge Pinto de Albuquerque's opinion in the ECtHR Grand Chamber case ______ v. Germany (2012) calls the protection of animal life and welfare a hallmark of international and European law.", "a": "Herrmann", "ex": "<p><i>Herrmann v. Germany<\/i>, appl. no. 9300/07, 26 June 2012 (p. 12, fn 17). Do not confuse it with <i>Tierbefreier e.V. v. Germany<\/i> (16 Jan. 2014), which comes in round 3 (fn 45).<\/p>"}, {"t": "mcq", "q": "How does the <i>EC – Seal Products<\/i> Panel Report treat the question whether animal welfare is a \"universal value\" or global social norm?", "opts": ["It answers yes", "It refers the question to the ICJ", "It answers no", "It leaves the question open"], "a": 3, "ex": "<p>Para. 7.420 \"leaves this open\" (fn 18, p. 12). The Panel did say that animal welfare \"is a globally recognized issue\" (p. 13), and that seal welfare is a legitimate objective under TBT Art. 2.2, which is a different point.<\/p>"}, {"t": "mcq", "q": "Which source do \"some legal scholars\" invoke when they argue that domestic animal-welfare codifications have produced a \"general principle of law\"?", "opts": ["Article 38 of the ICJ Statute", "Article 7.1.1 of the OIE Terrestrial Code", "Article 2(4) of the UN Charter", "Article 31(3)(c) of the Vienna Convention on the Law of Treaties"], "a": 0, "ex": "<p>\"[A] 'general principle of law' in the sense of Article 38 of the Statute of the International Court of Justice (ICJ), which would make it a formal source of international law\" (p. 12, fns 19–20). Art. 31(3)(c) VCLT is Peters's sixth ground (round 4); Art. 7.1.1 is the OIE's definition of welfare (round 3).<\/p>"}, {"t": "short", "q": "Does Peters say animal welfare is already a general principle of international law? State her position and who disagrees.", "a": "<p>No: she says the debate is \"<b>as yet unsettled<\/b>\" (p. 12). Some scholars (Sykes 2011; Bowman, Davies and Redgwell) argue that domestic codifications have already produced a general principle in the sense of Art. 38 ICJ Statute, a formal source (fns 19–20). Others leave it open: the WTO Panel in <i>EC – Seal Products<\/i> (para. 7.420, fn 18). Her case for global regulation does not depend on it (p. 16).<\/p>", "ex": "<p><b>Marks.<\/b> \"Unsettled\" (1); Art. 38 / general principle argued by some scholars (1); Panel leaves it open or her case does not rest on it (1). pp. 12, 16.<\/p>"}, {"t": "fill", "q": "The OIE's ______ member states recommended that it consider developing a global animal welfare strategy.", "a": "180", "ex": "<p>180 member states, Third OIE Global Conference on Animal Welfare, Kuala Lumpur, 6–8 Nov. 2012, Recommendation No. 9 (p. 12, fn 22).<\/p>"}, {"t": "mcq", "q": "The FAO sees the OIE members' recommendations as:", "opts": ["\"strong evidence of the growing consensus on the importance of animal welfare standards\"", "unnecessary, because states already regulate welfare", "a breach of the OIE mandate", "proof that animal welfare is already customary law"], "a": 0, "ex": "<p>p. 12, fn 23 (Vapnek & Chapman, p. 83). \"Customary law\" is a step Peters does not take; she says the legal status is unsettled.<\/p>"}, {"t": "mcq", "q": "In which dispute did a WTO panel say that \"animal welfare is a globally recognized issue\"?", "opts": ["<i>Whaling in the Antarctic<\/i>", "<i>EC – Biotech<\/i>", "<i>Herrmann v. Germany<\/i>", "<i>EC – Seal Products<\/i>"], "a": 3, "ex": "<p>p. 13, fn 24. <i>EC – Biotech<\/i> is the WTO Panel that read Art. 31(3)(c) VCLT narrowly (round 4). <i>Whaling in the Antarctic<\/i> is an ICJ judgment. <i>Herrmann<\/i> is an ECtHR case.<\/p>"}, {"t": "mcq", "q": "What conclusion does Peters draw at the end of section 3?", "opts": ["International rules should replace domestic law", "Domestic regulation is enough, once it is codified", "Domestic regulation is insufficient and must be complemented by international rules", "Regulation is no longer needed because markets handle welfare"], "a": 2, "ex": "<p>\"[R]egulation at the domestic level is insufficient to address animal welfare and, to be effective, needs to be complemented by international rules\" (p. 13). She does not call for replacing domestic law.<\/p>"}, {"t": "fill", "q": "International wildlife law protects the \"good-of-its-______\", not the \"good-of-its-own\".", "a": "kind", "ex": "<p>Species (\"good-of-its-kind\") against the flourishing of individual organisms (\"good-of-its-own\") (p. 13, fn 28, Bowman et al.).<\/p>"}, {"t": "mcq", "q": "Which three kinds of animals do the \"three quite different sets of law\" in section 4 concern?", "opts": ["Domestic, European and international animals", "Endangered species, whales and elephants", "Wild animals, pets and working animals", "Wild animals, farm animals and animals used in experiments"], "a": 3, "ex": "<p>p. 13. \"Domestic, European and international law\" are the three <i>levels<\/i> that make up these sets, not the three kinds. Pets and working animals are in the list of interactions in section 5 (p. 16).<\/p>"}, {"t": "short", "q": "Name Sykes's view, as Peters reports it, of the relation between animal welfare and animal conservation.", "a": "<p>They may \"stand in conflict at times\", but both can be viewed as \"<b>manifestations of the same overarching principle in different contexts<\/b>\" (p. 13, fn 29, Sykes p. 67). Yet isolated welfare norms remain \"incidental\" in regimes whose main aim is harvesting, trade, conservation and biodiversity (p. 13).<\/p>", "ex": "<p><b>Marks.<\/b> May conflict (1); same overarching principle in different contexts (1); welfare norms still incidental in international regimes (1). p. 13.<\/p>"}, {"t": "fill", "q": "CITES obliges parties on export permits and transport of living specimens \"to ______ the risk of injury, damage to health or cruel treatment\".", "a": "minimize", "acc": ["minimise"], "ex": "<p>CITES Arts III(2)(c) and VIII(3) (p. 14, fn 31). The Antarctic Protocol clause is different: \"the least degree of pain and suffering practicable\" (fn 32).<\/p>"}, {"t": "mcq", "q": "Which treaty requires that the taking of animals on the Antarctic landmass involve \"the least degree of pain and suffering practicable\"?", "opts": ["The 1991 Protocol on Environmental Protection to the Antarctic Treaty", "The Bern Convention", "CITES (1973)", "The Convention on Biological Diversity (1992)"], "a": 0, "ex": "<p>Art. 3(6), Annex II, Madrid, 4 Oct. 1991, in force 14 Jan. 1998 (p. 14, fn 32). CITES has the \"cruel treatment\" clause on transport; the Bern Convention is the source of Standing Committee Recommendation No. 77 on eradicating alien species (round 3).<\/p>"}], "notes": "<div class=\"lesson-map\"><b>What this round covers.<\/b> Why concern for animal welfare has spread, whether it is already a global norm or a source of law, who has recognised it as global, and then the first half of the gap: what international law covers instead, and the few welfare clauses in treaties.\n<ol><li>3. Why the concern spread, and its European roots<\/li><li>A universal value? A \"general principle of law\"?<\/li><li>Recognition: scholars, the OIE, the FAO, the WTO<\/li><li>The pivot: domestic law is not enough<\/li><li>4. What international instruments cover<\/li><li>Three sets of law; species against individual<\/li><li>Welfare clauses in treaties: CITES and the Antarctic Protocol<\/li><\/ol><\/div>\n\n<h3>1. \"3. Animal welfare as a global concern\": why the concern spread<\/h3>\n<p>Welfare, as a \"scientific, legal, and ethical concept\", grew from concern about the well-being of animals, and \"this concern has spread globally\" <span class=\"pg\">p. 11<\/span>. The reasons for \"a worldwide public opinion in favour of improving animal welfare are <b>manifold<\/b>\" <span class=\"pg\">p. 12<\/span>:<\/p>\n<ul>\n<li>In some regions <b>food safety and consumer health<\/b> predominate <span class=\"fnm\">fn 15<\/span> (the FAO's Kuemlangan: consumers see \"the links between animal health and animal welfare, and animal welfare and human well-being\").<\/li>\n<li>In others <b>ethical considerations, or simply compassion<\/b>, prevail <span class=\"fnm\">fn 16<\/span> (moral principles based on feelings of compassion, sympathy and empathy: Kelch).<\/li>\n<li>\"Mostly it seems to be a <b>mixture of motives<\/b>.\"<\/li><\/ul>\n<p>From these attitudes and \"concomitant business interests\", the idea of avoiding harm or at least cruelty to animals has been endorsed in \"numerous domestic legal systems, <b>notably in European countries<\/b>\" <span class=\"pg\">p. 12<\/span>. Peters backs this with <b>Judge Pinto de Albuquerque<\/b>, in a partly concurring and partly dissenting opinion in the <b>European Court of Human Rights<\/b> (ECtHR) Grand Chamber case <b><i>Herrmann v. Germany<\/i><\/b>, appl. no. 9300/07, <b>26 June 2012<\/b>, p. 36: \"One of the hallmarks of international and European law in contemporary times [is] the protection of animal life and welfare\" <span class=\"fnm\">fn 17<\/span>.<\/p>\n<p class=\"warn\"><b>Source misprint.<\/b> Several cross-references in the footnotes swap the two symposium authors. Fns 16, 52, 56 and 79 say \"Kelch, n. 2 above\" [n. 3: Kelch is fn 3], and fns 21, 24, 29 and 84 say \"Sykes, n. 3 above\" [n. 2: Sykes is fn 2]. Cite by author, not by note number.<\/p>\n\n<h3>2. A universal value? A \"general principle of law\"?<\/h3>\n<p>\"It is an <b>open question<\/b> whether that idea is already a 'universal value' or a truly global social norm\" <span class=\"pg\">p. 12<\/span>.<\/p>\n<table><tr><th>Source<\/th><th>Position<\/th><\/tr>\n<tr><td>WTO Panel, <b><i>EC – Seal Products<\/i><\/b> (Panel Report, WT/DS400/R and WT/DS401/R, 25 Nov. 2013), para. 7.420<\/td><td><b>Leaves it open<\/b> <span class=\"fnm\">fn 18<\/span><\/td><\/tr>\n<tr><td>Bowman, Davies and Redgwell, <i>Lyster's International Wildlife Law<\/i>, 2nd edn (2011), p. 678<\/td><td><b>Affirmative<\/b>: \"ample grounds for recognising concern for animal welfare both as a principle widely reflected in national legal systems and as a universal value, in the broader sense\" <span class=\"fnm\">fn 18<\/span><\/td><\/tr>\n<tr><td>\"Some legal scholars\"<\/td><td>The wealth of domestic codifications has already produced a \"<b>general principle of law<\/b>\" in the sense of <b>Article 38 of the Statute of the International Court of Justice<\/b> (San Francisco, 26 June 1945, in force 24 Oct. 1945) <span class=\"fnm\">fn 19<\/span>, \"which would make it a <b>formal source of international law<\/b>\" <span class=\"fnm\">fn 20<\/span><\/td><\/tr><\/table>\n<p>Footnote 20 names <b>Katie Sykes<\/b> (2011, 49 <i>Canadian Yearbook of International Law<\/i>, pp. 3–49), \"arguing that that there is an (emerging) legal principle of animal welfare protection\", and Bowman et al., p. 680. <span class=\"notin\">Footnote 20 prints the title as \"... General Principle of International Law concerning International Welfare\". Read it as a slip for animal welfare; the note's own gloss is \"animal welfare protection\".<\/span><\/p>\n<p><mark>Peters's verdict: \"this debate is as yet <b>unsettled<\/b>\"<\/mark> <span class=\"pg\">p. 12<\/span>. She does not need it settled: her case for global regulation (round 4) does not depend on \"a postulated but contested global principle\".<\/p>\n<div class=\"notin\">Not in Peters: Art. 38(1)(c) of the ICJ Statute lists \"the general principles of law recognized by civilized nations\" among the sources of international law. This is the course's Week 3 (sources) material.<\/div>\n<details class=\"check\"><summary>Check yourself: has Peters decided whether animal welfare is already a general principle of law?<\/summary><p>No. She says the debate is \"<b>as yet unsettled<\/b>\", citing scholars (Sykes, Bowman et al.) who argue it is, and the <i>EC – Seal Products<\/i> Panel, which \"leaves this open\" <span class=\"pg\">p. 12<\/span>, fns 18–20.<\/p><\/details>\n\n<h3>3. Recognised as global: scholars, the OIE, the FAO, the WTO<\/h3>\n<p>The relevance of the topic and \"the need for regulation has indeed been recognized globally\", by <b>scholars<\/b>, <b>governments<\/b> and <b>international organizations<\/b> <span class=\"pg\">p. 12<\/span>:<\/p>\n<table><tr><th>Who<\/th><th>What they said<\/th><\/tr>\n<tr><td><b>Scholars<\/b> (<b>Steven White<\/b>, \"Into the Void: International Law and the Protection of Animal Welfare\", <i>Global Policy<\/i> 2013)<\/td><td>\"the growing national and international significance of animal welfare as an area of policy and legal concern\" <span class=\"fnm\">fn 21<\/span>. Sykes, in the symposium, calls \"animal protection\" a global concern covering <b>both welfare and conservation<\/b> of species<\/td><\/tr>\n<tr><td><b>OIE<\/b>: its <b>180 member states<\/b><\/td><td>Formally recommended that the OIE \"support the development and implementation of OIE regional animal welfare strategies, and consider the development of a <b>global animal welfare strategy<\/b>\" <span class=\"fnm\">fn 22<\/span> (Third OIE Global Conference on Animal Welfare, <b>Kuala Lumpur, 6–8 Nov. 2012<\/b>, Recommendation No. 9)<\/td><\/tr>\n<tr><td><b>UN Food and Agriculture Organization (FAO)<\/b><\/td><td>Sees those recommendations as \"<b>strong evidence of the growing consensus<\/b> on the importance of animal welfare standards\" <span class=\"fnm\">fn 23<\/span><\/td><\/tr>\n<tr><td><b>WTO Dispute Settlement Body<\/b> (the Panel in <i>EC – Seal Products<\/i>)<\/td><td>\"various actions concerning animal welfare at the international as well as national levels suggest … that animal welfare is a <b>globally recognized issue<\/b>\" <span class=\"pg\">p. 13<\/span> <span class=\"fnm\">fn 24<\/span>. The Panel asked this to confirm that the objective of addressing \"public moral concerns on seal welfare\" is a <b>legitimate objective<\/b> under <b>Article 2.2 of the TBT Agreement<\/b> (technical barriers to trade)<\/td><\/tr><\/table>\n<p class=\"warn\"><b>Trap.<\/b> The OIE has <b>180<\/b> members and its conference was in <b>Kuala Lumpur<\/b> in <b>2012<\/b>. The <i>EC – Seal Products<\/i> Panel Report is <b>2013<\/b>. <i>Herrmann v. Germany<\/i> is <b>2012<\/b> too, but at the ECtHR.<\/p>\n\n<h3>4. The pivot: domestic law is not enough<\/h3>\n<p>\"<b>However<\/b>, regulation in respect of animal welfare is still <b>largely absent<\/b>, at both the domestic and international levels.\" <mark>\"In times of globalization, regulation at the domestic level is insufficient to address animal welfare and, to be effective, needs to be <b>complemented by international rules<\/b>.\"<\/mark> <span class=\"pg\">p. 13<\/span><\/p>\n\n<h3>5. \"4. The absence of animal welfare in international law\": what exists instead<\/h3>\n<p>\"[V]arious international law instruments\" address <b>endangered species<\/b>, <b>habitat protection<\/b> and <b>biological diversity<\/b>, but \"very little attention is given to the welfare of animals, <b>let alone animal rights<\/b>\" <span class=\"pg\">p. 13<\/span>. The footnotes name the instruments:<\/p>\n<table><tr><th>Area<\/th><th>Instrument<\/th><th>Details given<\/th><\/tr>\n<tr><td>Endangered species<\/td><td><b>CITES<\/b>, Washington, DC, <b>3 Mar. 1973<\/b>, in force <b>1 July 1975<\/b><\/td><td>fn 25<\/td><\/tr>\n<tr><td>Endangered species<\/td><td><b>Convention on the Conservation of Migratory Species of Wild Animals (CMS)<\/b>, Bonn, <b>23 June 1979<\/b>, in force <b>1 Nov. 1983<\/b><\/td><td>fn 25<\/td><\/tr>\n<tr><td>Habitat<\/td><td><b>EU Directive 92/43/EEC<\/b> on the Conservation of Natural Habitats and of Wild Fauna and Flora (1992)<\/td><td><span class=\"fnm\">fn 26<\/span><\/td><\/tr>\n<tr><td>Biological diversity<\/td><td><b>Convention on Biological Diversity (CBD)<\/b>, Rio de Janeiro, <b>5 June 1992<\/b>, in force <b>29 Dec. 1993<\/b><\/td><td><span class=\"fnm\">fn 27<\/span><\/td><\/tr><\/table>\n<p><span class=\"fnm\">fn 25<\/span> also points to further material on: <b>whales<\/b>, the ICJ case <b><i>Whaling in the Antarctic<\/i> (Australia v. Japan: New Zealand Intervening)<\/b>, Judgment of <b>31 Mar. 2014<\/b>; and <b>elephants<\/b> (Glennon, \"Has International Law Failed the Elephant?\", 1990; Adams, <i>Elephant Treaties: The Colonial Legacy of the Biodiversity Crisis<\/i>, 2014; Nollkaemper, 2014; and Peters's own blog post on a \"<b>novel practice of the Security Council<\/b>: wildlife poaching and trafficking as a <b>threat to the peace<\/b>\", 12 Feb. 2014). Peters gives these as references only; she does not discuss the ICJ judgment in the text.<\/p>\n\n<h3>6. Three sets of law; species against individual<\/h3>\n<p>\"Domestic, European and international law comprise <b>three quite different sets of law<\/b>\": one on <b>wild animals<\/b>, another on <b>farm animals<\/b>, a third on <b>animals used in experiments<\/b>. Provisions are \"dispersed\" and \"often applicable to members of a particular species only\" <span class=\"pg\">p. 13<\/span>.<\/p>\n<p><mark>International wildlife law \"generally deals with the <b>protection of species<\/b> ('good-of-its-kind') as opposed to the <b>flourishing of individual organisms<\/b> ('good-of-its-own')\"<\/mark> <span class=\"fnm\">fn 28<\/span> (Bowman et al., p. 672).<\/p>\n<div class=\"view\" data-who=\"Sykes, as Peters reports her\"><p>Welfare and conservation \"may stand in conflict at times\", but both can be viewed as \"<b>manifestations of the same overarching principle<\/b> in different contexts\" <span class=\"fnm\">fn 29<\/span> (Sykes, p. 67).<\/p><\/div>\n<div class=\"view\" data-who=\"Peters's view\"><p>\"Still, <b>isolated welfare norms remain incidental<\/b> in international legal regimes\", whose primary objective is regulating the <b>harvesting and trading<\/b> of animals, conservation and biodiversity <span class=\"pg\">p. 13<\/span>.<\/p><\/div>\n\n<h3>7. Welfare clauses in treaties<\/h3>\n<p>Peters's examples come from <i>Lyster's<\/i> wildlife-law text (as printed on p. 13: \"Lyster's Wildlife Law\"; the full title in fn 18 is <i>Lyster's International Wildlife Law<\/i>) <span class=\"pg\">pp. 13–14<\/span>:<\/p>\n<table><tr><th>Treaty<\/th><th>Welfare clause<\/th><\/tr>\n<tr><td><b>CITES<\/b> <span class=\"fnm\">fn 30<\/span> (same treaty as fn 25), on <b>export permits<\/b> and the <b>transport of living specimens<\/b><\/td><td>Obliges parties \"<b>to minimize the risk of injury, damage to health or cruel treatment<\/b>\" <span class=\"fnm\">fn 31<\/span> (Arts III(2)(c) and VIII(3))<\/td><\/tr>\n<tr><td><b>1991 Protocol on Environmental Protection to the Antarctic Treaty<\/b> (Madrid, 4 Oct. 1991, in force 14 Jan. 1998) <span class=\"fnm\">fn 32<\/span><\/td><td>The taking of animals on the Antarctic landmass must be done \"in the manner that involves <b>the least degree of pain and suffering practicable<\/b>\" (Art. 3(6), Annex II)<\/td><\/tr><\/table>\n<p class=\"tip\"><b>Memorise:<\/b> three areas covered (species, habitat, biodiversity); three sets of law (wild, farm, experiments); two treaty welfare clauses (CITES transport; Antarctic Protocol least pain). Round 3 adds the secondary law, the OIE, and Europe.<\/p>", "title": "Welfare as a global concern, and the gap begins", "mins": "25 + 10", "src": "\"3. Animal Welfare as a Global Concern\"; \"4. The Absence of Animal Welfare in International Law\" (first half, to the Antarctic Protocol), pp. 11–14 (fns 15–32)"}, {"id": "r3", "quiz": [{"t": "mcq", "q": "In contrast to treaty law, where are most animal-welfare provisions in international law found?", "opts": ["In secondary law from international organizations, bodies and conferences of the parties", "In bilateral investment treaties", "In customary international law", "In decisions of the International Court of Justice"], "a": 0, "ex": "<p>p. 14. The only ICJ case named is <i>Whaling in the Antarctic<\/i> (2014), given as further reading in fn 25, not as a source of welfare rules. Peters does not argue that custom contains them.<\/p>"}, {"t": "mcq", "q": "The Bern Convention's Standing Committee recommends that eradication of an alien species be:", "opts": ["as selective, ethical and without cruelty as possible", "banned entirely", "left to national law", "carried out only by licensed veterinarians"], "a": 0, "ex": "<p>\"[A]s selective, ethical and without cruelty as possible, consistent with the aim of permanently eliminating the invasive species\" (p. 14, fn 34, Recommendation No. 77 (1999)). It does not ban eradication: the aim is to eliminate the species.<\/p>"}, {"t": "mcq", "q": "Why are attempts to define guiding principles of whale welfare \"currently stalled\"?", "opts": ["The ICJ ruled whaling lawful in 2014", "Some IWC state parties say whale welfare oversteps the Commission's mandate", "The IWC has no member states", "The OIE took over whale welfare in 2005"], "a": 1, "ex": "<p>p. 14, fn 36. The 2014 discussion paper says the proposal for a definition and guiding principles \"has been removed\". <i>Whaling in the Antarctic<\/i> (31 Mar. 2014) is cited in fn 25 for further reading, not as the reason.<\/p>"}, {"t": "fill", "q": "How many sets of welfare standards has the OIE adopted since 2005?", "a": "eleven", "acc": ["11"], "ex": "<p>\"[I]n total eleven sets of welfare standards\": eight in the Terrestrial Animal Health Code and three in the Aquatic Animal Health Code (p. 14, fns 37–38).<\/p>"}, {"t": "mcq", "q": "How many of the OIE's welfare standards are in the Aquatic Animal Health Code?", "opts": ["Eleven", "Three", "Eight", "One"], "a": 1, "ex": "<p>Eight in the Terrestrial Code, three \"further\" in the Aquatic Code (p. 14). Eleven is the total.<\/p>"}, {"t": "mcq", "q": "In Art. 7.1.1 of the OIE Terrestrial Animal Health Code, \"animal welfare\" refers to:", "opts": ["the animal's right to life", "the state of the animal", "the animal's economic value", "the treatment an animal receives"], "a": 1, "ex": "<p>\"Animal welfare refers to the state of the animal; the treatment that an animal receives is covered by other terms such as animal care, animal husbandry, and humane treatment\" (fn 37, p. 14). Right to life is the rights position (p. 11).<\/p>"}, {"t": "mcq", "q": "What is \"a key shortcoming\" of secondary-law standards such as the OIE's?", "opts": ["They are typically not legally binding", "They apply only to wild animals", "They were drafted by the European Union", "They override domestic law"], "a": 0, "ex": "<p>\"[T]ypically they are not legally binding, but rather constitute guidelines or recommendations addressed to the organization's member states\" (pp. 14–15). The exception is IWC schedule-amending regulations under Art. V ICRW (fn 39).<\/p>"}, {"t": "fill", "q": "David Favre says the OIE's live-transport standards read like a ______ of issues that should be considered.", "a": "checklist", "acc": ["check list"], "ex": "<p>\"[N]o numbers, no prohibitions, no required inspections, and no limitations on operations\" (p. 15, fn 40).<\/p>"}, {"t": "short", "q": "Why, according to Favre as Peters quotes him, are the OIE's standards on live animal transport weak?", "a": "<p>They \"include no numbers, no prohibitions, no required inspections, and no limitations on operations\". They \"read like a checklist of issues that should be considered\": useful to policy makers but \"not an actual standard that limits or prohibits practices that are harmful to animal welfare\" (p. 15, fn 40). Peters uses this as the example of secondary law's weakness: such standards are not legally binding.<\/p>", "ex": "<p><b>Marks.<\/b> No numbers, prohibitions, inspections or limits (1); a checklist, not a standard that limits harmful practices (1); example of non-binding secondary law (1). p. 15.<\/p>"}, {"t": "mcq", "q": "In which period does Peters say European norms on the treatment of animals were enacted, mainly?", "opts": ["Since the 1960s", "Since 2005", "Since the 1880s", "Since the 1980s"], "a": 3, "ex": "<p>\"[M]ainly since the 1980s\" (p. 15). Do not confuse it with the OIE's 2005. The earliest Council of Europe convention in fn 42 is 1968, but the text says \"mainly\" since the 1980s.<\/p>"}, {"t": "mcq", "q": "What does Peters say about the European Court of Human Rights and animal law?", "opts": ["It has refused every animal-welfare case", "It has recognised animal rights as a global norm", "It is developing case law on the interface of human rights and animal law, but only regionally", "It enforces the OIE standards"], "a": 2, "ex": "<p>\"[D]eveloping case law on the interface between human rights and animal law ... only regional in scope\" (p. 15, fn 45, <i>Tierbefreier e.V. v. Germany<\/i>, 16 Jan. 2014). She does not claim global recognition of animal rights.<\/p>"}, {"t": "short", "q": "What is Peters's verdict on the existing international and regional law on animal welfare?", "a": "<p>\"[T]he piecemeal offering of international and regional law does not form a coherent and 'thick' body of law.\" The provisions are fragmented, often qualified, often inconsistent, unenforceable, and unknown to most lawyers, law enforcers and legal scholars (p. 15). Scholarship agrees: Otter et al. (no transnational animal protection regime exists), White (lack of a coherent legal regime; a gap), Bowman et al. (ad hoc and piecemeal, regional, without clear theoretical foundations) (pp. 15–16).<\/p>", "ex": "<p><b>Marks.<\/b> Not coherent or \"thick\" (1); fragmented, qualified, inconsistent, unenforceable, unknown (1); two scholars or their findings (1). pp. 15–16, fns 46–49.<\/p>"}, {"t": "mcq", "q": "Who finds that \"a transnational animal protection regime does not exist at present\"?", "opts": ["Kelch", "Otter and her co-authors", "Bowman and his co-authors", "Favre"], "a": 1, "ex": "<p>Caley Otter, O'Sullivan and Ross (p. 15, fn 46). Bowman et al. describe the problem as \"ad hoc and piecemeal\" (p. 16), a different quotation.<\/p>"}, {"t": "fill", "q": "According to Bowman and co-authors, welfare has been addressed in an \"ad hoc and ______ fashion\".", "a": "piecemeal", "ex": "\"[A]d hoc and piecemeal fashion, predominantly at the regional level and without the benefit of clear theoretical foundations\" (p. 16, fn 49)."}], "notes": "<div class=\"lesson-map\"><b>What this round covers.<\/b> Where most welfare rules sit (secondary law, not treaties), the Bern Convention and the International Whaling Commission, the OIE's standards and their weakness, European law, and the verdict that no coherent regime exists.\n<ol><li>Welfare rules sit in secondary law<\/li><li>The Bern Convention Standing Committee<\/li><li>The International Whaling Commission<\/li><li>The OIE: the main standard setter<\/li><li>The OIE's definition of animal welfare (fn 37)<\/li><li>The key shortcoming: not binding (Favre on live transport)<\/li><li>Europe: national, EU and Council of Europe law<\/li><li>Verdict: no \"thick\" body of law<\/li><li>The scholars' diagnosis<\/li><\/ol><\/div>\n\n<h3>1. Welfare rules sit in secondary law<\/h3>\n<p>\"In contradistinction to treaty law, <mark><b>most welfare provisions are contained in secondary law<\/b> emanating from international organizations, bodies, and conferences of the parties<\/mark>\" <span class=\"pg\">p. 14<\/span>. Two examples.<\/p>\n\n<h3>2. The Bern Convention Standing Committee<\/h3>\n<p>The <b>Standing Committee<\/b> of the Convention on the Conservation of European Wildlife and Natural Habitats (the <b>Bern Convention<\/b>) <span class=\"fnm\">fn 33<\/span> recommends that methods to eradicate an <b>alien species<\/b> be \"as selective, ethical and <b>without cruelty as possible<\/b>, consistent with the aim of permanently eliminating the invasive species\" <span class=\"fnm\">fn 34<\/span> (Recommendation No. 77 (1999) on the Eradication of Non-Native Terrestrial Vertebrates, <b>3 Dec. 1999<\/b>, Preamble) <span class=\"pg\">p. 14<\/span>.<\/p>\n<p class=\"warn\"><b>Source misprint.<\/b> Footnote 33 prints the Bern Convention as \"Bern (Switzerland), 19 Sept. 1982, in force 1 June 1982\": the date it entered into force comes before the date it was signed. <span class=\"notin\">Not in Peters: the Convention was opened for signature on 19 Sept. 1979, so 1982 looks like a slip for 1979 (my check, not the source's). Quote the printed text if asked.<\/span><\/p>\n\n<h3>3. The International Whaling Commission (IWC)<\/h3>\n<p>The IWC \"has espoused <b>whale welfare<\/b> as an issue\" <span class=\"fnm\">fn 35<\/span> (<b>Resolution 2004-3<\/b>, \"Resolution on Whale Killing Issues\": the IWC \"expresses concern, in light of its mandate and long-standing commitment to address welfare issues\"). <mark>But some state parties contest this as <b>overstepping the Commission's mandate<\/b>. As a result, attempts to define guiding principles of whale welfare are \"<b>currently stalled<\/b>\"<\/mark> <span class=\"pg\">p. 14<\/span>.<\/p>\n<p>Footnote 36 gives the 2014 evidence: the updated Discussion Paper \"Addressing Welfare within the IWC\" (Doc. IWC/65/WKM&AWI05Rev 2, 17 Sept. 2014) says the \"proposal for a definition and guiding principles of welfare <b>has been removed<\/b>\"; the parties are instead to discuss, between sessions, whether a \"shared understanding of non-hunting welfare aspects related to human activities\" is possible <span class=\"fnm\">fn 36<\/span>.<\/p>\n<p><span class=\"fnm\">fn 39<\/span> An exception to non-binding secondary law: <b>IWC regulations<\/b> that amend the schedule (as opposed to its recommendations) <b>are binding<\/b>. The source is <b>Art. V of the International Convention for the Regulation of Whaling (ICRW)<\/b>, Washington, DC, <b>2 Dec. 1946<\/b>, in force 10 Nov. 1948.<\/p>\n\n<h3>4. The OIE: the main standard setter<\/h3>\n<p><mark>\"The main international standard setter for animal welfare has been the <b>OIE<\/b>. Since <b>2005<\/b>, it has adopted in total <b>eleven sets of welfare standards<\/b>. <b>Eight<\/b> of these sets have been collectively incorporated into its <b>Terrestrial Animal Health Code<\/b>, and <b>three<\/b> further standards into its <b>Aquatic Animal Health Code<\/b>.\"<\/mark> <span class=\"pg\">p. 14<\/span> <span class=\"fnm\">fns 37–38<\/span><\/p>\n<div class=\"notin\">OIE is the World Organisation for Animal Health (p. 12). Fn 73 (round 5) names the 1924 agreement that created it: the \"Office International des Epizooties\" in Paris.<\/div>\n\n<h3>5. The OIE's definition of animal welfare<\/h3>\n<p>Footnote 37 quotes <b>Art. 7.1.1 (\"Definition\")<\/b> of the <i>Terrestrial Animal Health Code<\/i> (2015) <span class=\"fnm\">fn 37<\/span>:<\/p>\n<blockquote>\"Animal welfare means how an animal is coping with the conditions in which it lives. An animal is in a good state of welfare if (as indicated by scientific evidence) it is healthy, comfortable, well nourished, safe, able to express innate behaviour, and if it is not suffering from unpleasant states such as pain, fear, and distress. Good animal welfare requires disease prevention and appropriate veterinary treatment, shelter, management and nutrition, humane handling and humane slaughter or killing. Animal welfare refers to the state of the animal; the treatment that an animal receives is covered by other terms such as animal care, animal husbandry, and humane treatment.\"<\/blockquote>\n<p>Peters also lists <b>Art. 7.1.2<\/b> (\"Guiding Principles for Animal Welfare\"), <b>Art. 7.1.3<\/b> (\"Scientific Basis for Recommendations\") and <b>Art. 7.1.4<\/b> (\"General Principles for the Welfare of Animals in Livestock Production Systems\"). <mark>Welfare refers to the <b>state<\/b> of the animal, not to the treatment it receives.<\/mark><\/p>\n<details class=\"check\"><summary>Check yourself: in the OIE's definition, is welfare the animal's state or the treatment it receives?<\/summary><p>The <b>state<\/b> of the animal. Treatment is covered by other terms: \"animal care, animal husbandry, and humane treatment\" (Art. 7.1.1, fn 37).<\/p><\/details>\n\n<h3>6. The key shortcoming: not binding<\/h3>\n<p><mark>\"A key shortcoming of secondary law standards is that typically they are <b>not legally binding<\/b>, but rather constitute <b>guidelines or recommendations<\/b> addressed to the organization's member states.\"<\/mark> <span class=\"pg\">pp. 14–15<\/span> The IWC's schedule-amending regulations are the one exception (fn 39, above).<\/p>\n<p>The OIE's standards on <b>live animal transport<\/b> show it. <b>David Favre<\/b> observes that they \"include no numbers, no prohibitions, no required inspections, and no limitations on operations. Rather, the standards read like a <b>checklist of issues that should be considered<\/b> ... While this list is useful for policy makers, it is not an actual standard that limits or prohibits practices that are harmful to animal welfare\" <span class=\"fnm\">fn 40<\/span> (<i>Animal Law Review<\/i> 18 (2012), p. 252) <span class=\"pg\">p. 15<\/span>.<\/p>\n<div class=\"view\" data-who=\"Favre, as Peters reports him\"><p>OIE standards on live transport are a <b>checklist<\/b>: no numbers, no prohibitions, no required inspections, no limitations.<\/p><\/div>\n\n<h3>7. Europe: national, EU and Council of Europe law<\/h3>\n<p>European countries, \"both at the national level and through the <b>European Union (EU)<\/b> and the <b>Council of Europe (CoE)<\/b>\", have enacted norms on four areas, \"mainly since the <b>1980s<\/b>\" <span class=\"pg\">p. 15<\/span>:<\/p>\n<table><tr><th>Area<\/th><th>Council of Europe<\/th><th>EU (fn 41)<\/th><\/tr>\n<tr><td><b>Keeping of farming animals<\/b> <span class=\"fnm\">fn 41<\/span><\/td><td><b>1976<\/b> CoE (Framework) Convention for the Protection of Animals Kept for Farming Purposes (Strasbourg, 10 Mar. 1976, in force 10 Sept. 1978), plus its <b>1992<\/b> Protocol for Adaptation to Biotechnologies<\/td><td>Directive <b>98/58/EC<\/b> (farming animals); <b>1999/74/EC<\/b> (laying hens); <b>2008/120/EC<\/b> (pigs); <b>2007/43/EC<\/b> (chickens kept for meat)<\/td><\/tr>\n<tr><td><b>Transport<\/b> <span class=\"fnm\">fn 42<\/span><\/td><td><b>1968<\/b> Convention for the Protection of Animals during International Transport (Paris, 13 Dec. 1968, in force 20 Feb. 1971); 1979 Additional Protocol to allow EU membership; revised at Chisinau, <b>6 Nov. 2003<\/b> (in force 14 Mar. 2006), open also to the EU and non-CoE states<\/td><td><\/td><\/tr>\n<tr><td><b>Slaughter<\/b> <span class=\"fnm\">fn 43<\/span><\/td><td><b>1979<\/b> Convention for the Protection of Animals for Slaughter (Strasbourg, 10 May 1979, in force 11 June 1982)<\/td><td><\/td><\/tr>\n<tr><td><b>Pets<\/b> <span class=\"fnm\">fn 44<\/span><\/td><td><b>1987<\/b> Convention for the Protection of Pet Animals (Strasbourg, 13 Nov. 1987, in force 1 May 1992)<\/td><td><\/td><\/tr><\/table>\n<p>\"Moreover, the <b>European Court of Human Rights<\/b> is developing case law on the interface between human rights and animal law\", for example <b><i>Tierbefreier e.V. v. Germany<\/i><\/b>, appl. no. 45192/09, Judgment, <b>16 Jan. 2014<\/b> <span class=\"fnm\">fn 45<\/span>, \"although this body of law is only <b>regional in scope<\/b>\" <span class=\"pg\">p. 15<\/span>.<\/p>\n<p class=\"tip\"><b>Memorise the Council of Europe's four:<\/b> farming (1976), transport (1968), slaughter (1979), pets (1987).<\/p>\n<p class=\"warn\"><b>Trap.<\/b> The text says European norms were enacted \"mainly since the 1980s\", yet the footnotes date the Council of Europe conventions 1968, 1976, 1979 and 1987. Quote the text for the period and the footnote for each date.<\/p>\n\n<h3>8. The verdict: no \"thick\" body of law<\/h3>\n<div class=\"view\" data-who=\"Peters's view\"><p><mark>\"Clearly, the piecemeal offering of international and regional law does not form a <b>coherent and 'thick' body of law<\/b>.\"<\/mark> The provisions are \"<b>fragmented, often qualified, often inconsistent, unenforceable<\/b>, and moreover <b>unknown to most lawyers, law enforcers and legal scholars alike<\/b>\". The sparse legal scholarship \"confirm[s] this diagnosis\" <span class=\"pg\">p. 15<\/span>.<\/p><\/div>\n\n<h3>9. The scholars' diagnosis<\/h3>\n<table><tr><th>Scholars<\/th><th>Finding<\/th><\/tr>\n<tr><td><b>Caley Otter<\/b> and co-authors (Otter, O'Sullivan and Ross, \"Laying the Foundations for an International Animal Protection Regime\", 2012) <span class=\"fnm\">fn 46<\/span><\/td><td>\"a <b>transnational animal protection regime does not exist at present<\/b>\" <span class=\"pg\">p. 15<\/span><\/td><\/tr>\n<tr><td><b>Steven White<\/b> <span class=\"fnm\">fn 47<\/span><\/td><td>Deplores the \"<b>lack of a coherent legal regime<\/b>\", and \"that there is currently a <b>gap in the international legal protection<\/b> of animal welfare\" <span class=\"pg\">p. 15<\/span><\/td><\/tr>\n<tr><td><b>Michael Bowman<\/b> and co-authors <span class=\"fnm\">fns 48–49<\/span><\/td><td>\"the welfare of individual animals (whether wild or domesticated) is <b>emerging as a significant and pervasive concern<\/b> of the international community, albeit one which has not yet attracted the level of attention or consistency of response\"; the problem \"has thus far been addressed in an <b>ad hoc and piecemeal fashion<\/b>, predominantly at the <b>regional level<\/b> and without the benefit of clear theoretical foundations\" <span class=\"pg\">p. 16<\/span><\/td><\/tr><\/table>\n<p>The symposium articles \"also display a <b>scattered and patchy picture<\/b> of legal norms relating to animal welfare\" <span class=\"pg\">p. 16<\/span>.<\/p>\n<details class=\"check\"><summary>Check yourself: why does Peters call the OIE's transport standards weak?<\/summary><p>They are not binding, and (Favre) they \"read like a <b>checklist<\/b>\": no numbers, no prohibitions, no required inspections, no limitations <span class=\"pg\">p. 15<\/span>.<\/p><\/details>\n<p class=\"warn\"><b>Trap.<\/b> The OIE has set eleven welfare standards <b>since 2005<\/b>: eight in the Terrestrial Code and three in the Aquatic Code. The OIE's own Strategic Plan with welfare as a priority is dated <b>2001–05<\/b> (round 5). Do not mix the two dates.<\/p>", "title": "Secondary law, the OIE, Europe, and a diagnosis", "mins": "25 + 10", "src": "\"4. The Absence of Animal Welfare in International Law\" (second half, from \"In contradistinction to treaty law\"), pp. 14–16 (fns 33–50)"}, {"id": "r4", "quiz": [{"t": "mcq", "q": "Why, according to Peters, does animal welfare call for global regulation \"per se\"?", "opts": ["Virtually all aspects of human–animal interactions have a transboundary dimension", "The UN Charter requires it", "All states have the same animal-protection laws", "A global principle that animals must be treated decently already exists"], "a": 0, "ex": "<p>p. 16. The need for global regulation is \"not dependent on the existence of a postulated but contested global principle\". The UN Charter is not mentioned in the text.<\/p>"}, {"t": "short", "q": "Name Peters's six grounds for the globalization of the issue of animal welfare, in the order she gives them.", "a": "<ol><li>Consumers' attention to welfare in purchasing decisions.<\/li><li>Prevention of evasion of the law (relocation, leakage, race to the bottom).<\/li><li>A level playing field: uniform international standards.<\/li><li>Embeddedness in a complex set of global issues (environment, climate, poverty).<\/li><li>A benchmark for local, national and international legislation.<\/li><li>An interpretative guideline for existing regimes, via VCLT Art. 31(3)(c).<\/li><\/ol>", "ex": "<p>pp. 16–19. One mark per ground. The sixth is the only one that rests on a treaty rule (VCLT).<\/p>"}, {"t": "mcq", "q": "What should the \"first stage of regulation\" aim for, as the market cannot inform consumers well?", "opts": ["A global court for animals", "A WTO-wide welfare standard", "An outright ban on animal use", "Transparency, consumer information, certification and labelling"], "a": 3, "ex": "<p>p. 17. Kelch's point is that the animal-use industry fosters human ignorance. A WTO-wide standard is the EU's 2000 proposal, which has \"not found favour\" (p. 19).<\/p>"}, {"t": "fill", "q": "Relocation of industry to low-standard countries is called \"______\" in Peters's account.", "a": "leakage", "ex": "<p>\"Such relocation, or 'leakage', to cheap and low-standard countries then renders high national animal-protection standards meaningless\" (p. 17).<\/p>"}, {"t": "mcq", "q": "Which example does Peters use for evasion of animal-welfare law by relocation?", "opts": ["Zoos moving from Germany to Switzerland", "Horse slaughter moving from the United States to Mexico after 2007", "Seal hunting moving from Canada to the EU", "Whaling moving from Japan to Norway"], "a": 1, "ex": "<p>After the last US horse slaughter facilities closed in 2007, exports of horses for slaughter to Canada and Mexico rose, by 660% to Mexico (pp. 17–18, fn 58). Seal hunting is the EU's regulatory example for ground 1 (p. 17).<\/p>"}, {"t": "fill", "q": "Exports of horses for slaughter to Mexico increased dramatically by ______ per cent.", "a": "660", "acc": ["660%"], "ex": "<p>p. 18, citing GAO-11-228 (June 2011) (fn 58).<\/p>"}, {"t": "mcq", "q": "What was the Basel Declaration (2010) implicitly meant to do?", "opts": ["Create a global ban on animal experiments", "Set the OIE's laboratory-animal standards", "Replace the Swiss Animal Protection Statute", "Persuade regulators and the public not to over-regulate biomedical research on animals"], "a": 3, "ex": "<p>\"[W]ith the (implicit) objective of persuading regulators and the public to renounce overly strict regulation of biomedical research involving animals\" (p. 18, fn 59). The organisers pointed to the risk to Switzerland as a research site.<\/p>"}, {"t": "mcq", "q": "What does a \"race to the bottom\" mean in section 5?", "opts": ["States compete to raise welfare standards the fastest", "States compete for mobile industries by lowering or relaxing welfare standards", "The OIE ranks states by welfare score", "Consumers compete for the cheapest animal products"], "a": 1, "ex": "<p>\"[A] downward spiral of standards, a race to the bottom, to the detriment of animal welfare\" (p. 18, fn 60). Favre: unrestrained competition imposes \"the most inhumane conditions\" because they are cheapest.<\/p>"}, {"t": "short", "q": "Explain Peters's \"level playing field\" argument and her textbook example from another field.", "a": "<p>High-standard states can respond to competition either by lowering standards (race to the bottom) or by campaigning for <b>uniform international standards<\/b>, which stop other states exploiting lower standards as an unfair advantage and put all businesses under the same high standard (p. 18). Textbook example: <b>anti-corruption<\/b>. The US adopted strict national laws, found its firms disadvantaged in Eastern Europe, and pressed for the <b>OECD Anti-Bribery Convention<\/b> (21 Nov. 1997), which binds all parties (fn 62).<\/p>", "ex": "<p><b>Marks.<\/b> Uniform standards instead of lowering (1); level the playing field / stop unfair advantage (1); the anti-corruption example, OECD Convention 1997 (1). p. 18, fn 62.<\/p>"}, {"t": "mcq", "q": "What happened to the EU's proposal that the WTO adopt a WTO-wide animal welfare standard?", "opts": ["The ICJ approved it in an advisory opinion", "The EU withdrew it after <i>Airbus<\/i>", "The WTO adopted it in 2000", "It has not found favour with WTO members"], "a": 3, "ex": "<p>The EU proposal is dated 28 June 2000 (fn 63); \"thus far\" it \"has not found favour with WTO members\" (p. 19). <i>Airbus<\/i> (2011) is about the VCLT Art. 31(3)(c) point (fn 67).<\/p>"}, {"t": "mcq", "q": "In Peters's fifth ground, what does an international benchmark spare animal-welfare activists from?", "opts": ["Suing the OIE", "Battling for new laws in multiple, isolated national jurisdictions", "Proving that animals are sentient", "Publishing consumer labels"], "a": 1, "ex": "<p>\"[T]he daunting and repetitive task of battling for new laws in multiple, isolated national jurisdictions\"; they can \"devote their scarce resources on implementation\" (p. 19, fn 65, Favre).<\/p>"}, {"t": "fill", "q": "The sixth ground relies on Article ______(3)(c) of the Vienna Convention on the Law of Treaties.", "a": "31", "ex": "<p>\"[T]here shall be taken into account … any relevant rules of international law applicable in the relations between the parties\" (p. 19, fn 67).<\/p>"}, {"t": "mcq", "q": "Which WTO Panel report did Peters say construed Art. 31(3)(c) VCLT \"infamously narrowly\"?", "opts": ["<i>EC – Seal Products<\/i> (2013)", "<i>EC – Biotech<\/i> (2006)", "<i>Airbus<\/i> (2011)", "<i>Whaling in the Antarctic<\/i> (2014)"], "a": 1, "ex": "<p>Fn 67, p. 19. The Panel held the Cartagena Protocol \"not applicable\" because Argentina, Canada and the US had not ratified it. The Appellate Body in <i>Airbus<\/i> (18 May 2011) moved away from that approach.<\/p>"}, {"t": "mcq", "q": "Why does Peters say only international rules, not domestic ones, could help to read trade agreements in a more animal-friendly way?", "opts": ["Art. 31(3)(c) VCLT takes into account relevant rules of international law applicable between the parties", "The WTO accepts only rules made by the OIE", "Domestic rules are always unenforceable", "Art. 38 of the ICJ Statute makes international rules binding on the WTO"], "a": 0, "ex": "<p>\"[T]here shall be taken into account … any relevant rules of international law applicable in the relations between the parties\" (Art. 31(3)(c)). \"Only international, rather than domestic, rules could perform this important function as a catalyst for a more animal-friendly reading of existing international trade agreements\" (p. 19, fn 67). Art. 38 ICJ Statute is the sources question of round 2.<\/p>"}, {"t": "short", "q": "What is Peters's final conclusion to section 5, and what is her view of the <i>EC – Biotech<\/i> approach to VCLT Art. 31(3)(c)?", "a": "<p>Rules for improving animal welfare can be effective <b>only if enacted globally<\/b>: at domestic and international levels, as state or interstate regulation and non-state standards (pp. 19–20). On <i>Biotech<\/i>: it read \"applicable in the relations between the parties\" \"infamously narrowly\" (the Cartagena Protocol was \"not applicable\" as the complaining parties had not ratified it), and <i>Airbus<\/i> moved away from it. The \"better and now prevailing view\" is that not all states in the organization or treaty need be party to the other treaty (fn 67).<\/p>", "ex": "<p><b>Marks.<\/b> Effective only if global, domestic and international, state and non-state (1); <i>Biotech<\/i> read narrowly and Protocol \"not applicable\" (1); prevailing view is the opposite, and <i>Airbus<\/i> moved away (1). pp. 19–20, fn 67.<\/p>"}], "notes": "<div class=\"lesson-map\"><b>What this round covers.<\/b> The section's central claim, and its six overlapping grounds: (1) consumers, (2) evasion and the race to the bottom, (3) a level playing field, (4) embeddedness in global issues, (5) a benchmark for activists, (6) an interpretative guideline under the Vienna Convention.\n<ol><li>The central claim: transboundary interactions<\/li><li>Ground 1: consumers and the market<\/li><li>Ground 2: evasion of the law (leakage)<\/li><li>Ground 3: the level playing field<\/li><li>Ground 4: embeddedness<\/li><li>Ground 5: a benchmark<\/li><li>Ground 6: VCLT Article 31(3)(c)<\/li><li>The conclusion of the section<\/li><\/ol><\/div>\n\n<h3>1. The central claim<\/h3>\n<p>Business and trade sectors, and legal and political science scholarship, have taken note of the \"current legal gap and the need to close it\" <span class=\"fnm\">fn 50<\/span> <span class=\"pg\">p. 16<\/span>. <mark>\"[A]ny practical or academic treatment of the issue can no longer sensibly remain confined to the sphere of the <b>nation state<\/b>.\"<\/mark><\/p>\n<div class=\"view\" data-who=\"Peters's view\"><p>The imperative of global regulation \"stems from a number of ideational and material factors which are <b>not dependent on the existence of a postulated but contested global principle<\/b> that animals should be treated decently\". <mark>The reason: \"virtually all aspects of (commodified) human−animal interactions\" (food production and distribution, working animals, animal use in research, breeding and keeping of pets) \"possess a <b>transboundary dimension<\/b>\". So animal welfare \"is a <b>global issue p
